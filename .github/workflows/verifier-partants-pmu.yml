name: Vérifier les partants et codes PMU avant les courses
on:
  push:
    branches: [main]
    paths:
      - "scripts/verifier_partants_pmu.py"
      - "docs/chevaux/data/editorial.json"
      - ".github/workflows/verifier-partants-pmu.yml"
  schedule:
    # Plusieurs contrôles chaque jour (le cron GitHub peut être retardé).
    # Le contrôle vise les courses confirmées dans les 48 prochaines heures.
    - cron: '12 5-21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: preflight-pmu
  cancel-in-progress: false
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tester les règles de correspondance (sans réseau)
        run: python scripts/verifier_partants_pmu.py --self-test
      - name: Vérifier la course, l'hippodrome, l'heure, le numéro et l'identité PMU
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/verifier_partants_pmu.py --apply
          else
            python scripts/verifier_partants_pmu.py
          fi
      - name: Enregistrer les codes vérifiés
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: save
        run: |
          if git diff --quiet -- docs/chevaux/data/editorial.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun code PMU à corriger"
            exit 0
          fi
          git config user.name "Écurie Initial · précontrôle PMU"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chevaux/data/editorial.json
          git commit -m "Précontrôle avant les courses : RnCm et dossards PMU confirmés"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publier les corrections sur le site et l'application
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/preflight-pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")
          echo "Publication : HTTP $CODE"
          if [[ "$CODE" != "201" && "$CODE" != "202" ]]; then
            cat /tmp/preflight-pages.json
            exit 1
          fi
