name: Déployer les notifications (Supabase)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/notifications/**"
      - "supabase/functions/push-dispatch/**"
      - "supabase/functions/public-race-results/**"
      - ".github/workflows/deployer-notifications.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Sélectionner uniquement les fonctions modifiées
        id: changed
        run: |
          notifications=false
          push_dispatch=false
          public_results=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            notifications=true
            push_dispatch=true
            public_results=true
          else
            if ! git diff --quiet HEAD^ HEAD -- supabase/functions/notifications; then
              notifications=true
            fi
            if ! git diff --quiet HEAD^ HEAD -- supabase/functions/push-dispatch; then
              push_dispatch=true
            fi
            if ! git diff --quiet HEAD^ HEAD -- supabase/functions/public-race-results; then
              public_results=true
            fi
          fi
          echo "notifications=$notifications" >> "$GITHUB_OUTPUT"
          echo "push_dispatch=$push_dispatch" >> "$GITHUB_OUTPUT"
          echo "public_results=$public_results" >> "$GITHUB_OUTPUT"
      - name: Installer Python pour les contrôles
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Node pour vérifier les scripts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les pages, rôles, fonctions et données AVANT le déploiement
        run: |
          python scripts/verifier_application.py
          node scripts/valider_non_partants_push.mjs
          node scripts/valider_reception_push.mjs
          node scripts/valider_details_resultats.mjs
      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Déployer les fonctions Push modifiées
        if: steps.changed.outputs.notifications == 'true' || steps.changed.outputs.push_dispatch == 'true' || steps.changed.outputs.public_results == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Le secret SUPABASE_ACCESS_TOKEN est absent."
            exit 1
          fi
          # Ces endpoints gèrent eux-mêmes leur authentification:
          # - notifications vérifie le jeton d'appareil
          # - push-dispatch exige le secret PUSH_JOB_SECRET
          if [ "${{ steps.changed.outputs.notifications }}" = "true" ]; then
            supabase functions deploy notifications --project-ref yeecwaaizmvrhwobukfa --no-verify-jwt --yes
          fi
          if [ "${{ steps.changed.outputs.push_dispatch }}" = "true" ]; then
            supabase functions deploy push-dispatch --project-ref yeecwaaizmvrhwobukfa --no-verify-jwt --yes
          fi
          # Lecture publique limitée aux performances officialisées et filtrées.
          if [ "${{ steps.changed.outputs.public_results }}" = "true" ]; then
            supabase functions deploy public-race-results --project-ref yeecwaaizmvrhwobukfa --no-verify-jwt --yes
          fi
      - name: Étapes restantes
        run: |
          echo "Déploiement du code terminé. Les notifications ne sont PAS actives tant que:"
          echo "1. Les migrations SQL ne sont pas appliquées."
          echo "2. Les clés VAPID et PUSH_JOB_SECRET ne sont pas configurés dans Supabase."
          echo "3. La tâche cron sécurisée n'est pas programmée."
          echo "4. Un essai réel sur appareil n'est pas validé."
