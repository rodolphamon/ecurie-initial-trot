name: Réparer l'authentification Push via Supabase Vault
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/synchroniser-secret-push.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Synchroniser la clé Vault sans l'afficher
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Jeton Supabase absent"
            exit 1
          fi
          SQL="select decrypted_secret from vault.decrypted_secrets where name = 'ei_initial_push_job_secret' limit 1"
          BODY=$(jq -cn --arg sql "$SQL" '{query:$sql}')
          RESPONSE=$(curl --fail --silent --show-error --retry 2 \
            -X POST "https://api.supabase.com/v1/projects/yeecwaaizmvrhwobukfa/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          SECRET=$(printf '%s' "$RESPONSE" | jq -er '.[0].decrypted_secret')
          if [ "${#SECRET}" -lt 32 ]; then
            echo "::error::Clé Vault absente ou trop courte"
            exit 1
          fi
          echo "::add-mask::$SECRET"
          ENV_FILE="$RUNNER_TEMP/initial-push.env"
          trap 'rm -f "$ENV_FILE"' EXIT
          (umask 077; printf 'PUSH_JOB_SECRET=%s\n' "$SECRET" > "$ENV_FILE")
          supabase secrets set --project-ref yeecwaaizmvrhwobukfa --env-file "$ENV_FILE" --yes
          echo "Secret PUSH_JOB_SECRET resynchronisé avec Vault (valeur masquée)."
