name: Restaurer une fonction Supabase (manuel)

# Aucun déploiement automatique : une restauration doit être choisie et lancée
# explicitement depuis l'interface GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      fonction:
        description: 'Fonction sauvegardée à redéployer'
        required: true
        type: choice
        options:
          - smart-service
          - team-contact
          - push-receipt

permissions:
  contents: read

concurrency:
  group: restaurer-supabase-${{ inputs.fonction }}
  cancel-in-progress: false

jobs:
  restauration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Utiliser les fichiers Git sélectionnés
        uses: actions/checkout@v4
      - name: Vérifier Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler les sources et règles de sécurité
        run: python scripts/verifier_application.py
      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Restaurer uniquement la fonction sélectionnée
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FONCTION: ${{ inputs.fonction }}
        run: |
          set -eu
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN non configuré. Aucune fonction modifiée."
            exit 1
          fi
          case "$FONCTION" in
            smart-service)
              # JWT obligatoire pour smart-service.
              supabase functions deploy smart-service --project-ref yeecwaaizmvrhwobukfa --yes
              ;;
            team-contact|push-receipt)
              # Les deux fonctions gèrent leur authentification en interne.
              supabase functions deploy "$FONCTION" --project-ref yeecwaaizmvrhwobukfa --no-verify-jwt --yes
              ;;
            *)
              echo "::error::Fonction non autorisée. Aucun déploiement."
              exit 1
              ;;
          esac
          echo "Déploiement demandé pour $FONCTION. Effectuer un test réel après restauration."
