name: Déployer la gestion des associés (Supabase)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gerer-associes/**'
      - '.github/workflows/deployer-gestion-associes.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Python pour les contrôles
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Node pour vérifier les scripts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les pages, rôles, fonctions et données AVANT le déploiement
        run: python scripts/verifier_application.py
      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Déployer uniquement la gestion des associés
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy gerer-associes --project-ref yeecwaaizmvrhwobukfa --yes
      - name: Vérifier le déploiement
        run: |
          echo "Le déploiement de gerer-associes est terminé."
          echo "Vérifier ensuite les logs, les tests de connexion et SMTP dans Supabase."
