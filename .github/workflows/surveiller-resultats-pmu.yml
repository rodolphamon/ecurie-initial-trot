name: Surveiller les résultats définitifs PMU
on:
  push:
    branches: [main]
    paths:
      - "scripts/monitor_pmu_results.py"
      - "scripts/synchroniser_palmares_resultats.py"
      - "docs/chevaux/data/editorial.json"
      - "docs/chevaux/data/chevaux.json"
      - ".github/workflows/surveiller-resultats-pmu.yml"
  schedule:
    # GitHub déclenche au mieux toutes les 5 min ; un job interroge
    # ensuite le PMU toutes les 45 s dès H+12 min après le départ prévu.
    # Couverture étendue pour les réunions en soirée (heures UTC).
    - cron: '*/5 6-23 * * *'
    - cron: '*/5 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: resultats-pmu
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Valider la logique et les sources PMU (essai à blanc)
        if: github.event_name != 'schedule'
        run: python scripts/monitor_pmu_results.py --self-test --probe
      - name: Vérifier la synchronisation palmarès (sans écriture)
        if: github.event_name != 'schedule'
        run: python scripts/synchroniser_palmares_resultats.py --self-test
      - name: Chercher les classements définitifs (écriture si confirmés)
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/monitor_pmu_results.py --apply --poll --poll-seconds 240 --interval-seconds 45
      - name: Contrôler les gains LeTROT après nouvelle arrivée
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- docs/chevaux/data/editorial.json; then
            echo "Aucun nouveau résultat publié : contrôle quotidien séparé des gains."
          else
            # Le cumul officiel peut paraître après la publication de l'arrivée.
            # Le contrôle quotidien recontrôlera les montants les jours suivants.
            python scripts/synchroniser_gains_trot.py --apply --recent
          fi
      - name: Synchroniser automatiquement victoires et podiums officiels
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/synchroniser_palmares_resultats.py --apply
      - name: Enregistrer les résultats définitifs vérifiés
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: save
        run: |
          if git diff --quiet -- docs/chevaux/data/editorial.json docs/data/effectif-trot.json docs/palmares/victoires-a-ajouter.json docs/palmares/podiums.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun nouveau résultat officiel à publier."
            exit 0
          fi
          git config user.name "Écurie Initial · résultats automatiques"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chevaux/data/editorial.json docs/data/effectif-trot.json docs/palmares/victoires-a-ajouter.json docs/palmares/podiums.json
          git commit -m "Résultats PMU, gains et palmarès vérifiés (Écurie Initial)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Déclencher la publication GitHub Pages après modification
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/ei-pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")
          echo "Demande de publication GitHub Pages : HTTP $CODE"
          cat /tmp/ei-pages.json
          if [ "$CODE" != "201" ] && [ "$CODE" != "202" ]; then exit 1; fi
      - name: Tester la possibilité de reconstruire les Pages (sans changer les résultats)
        if: github.event_name == 'push' && steps.save.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/ei-pages-probe.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")
          echo "Essai publication GitHub Pages : HTTP $CODE"
          cat /tmp/ei-pages-probe.json
          if [ "$CODE" != "201" ] && [ "$CODE" != "202" ]; then exit 1; fi
