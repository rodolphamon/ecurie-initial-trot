<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Effectif Galop — Écurie Initial</title><style>:root{--orange:#f47721;--dark:#171717}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#222;font:15px Arial,Helvetica,sans-serif}.scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:max-content;min-width:100%;table-layout:auto;border-collapse:collapse;background:#fff}thead{background:var(--dark);color:#fff}th,td{padding:10px 12px;border-bottom:1px solid #ececec;text-align:left;vertical-align:middle}th{font-weight:700;font-size:14px}tbody tr:nth-child(even){background:#fff7f0}tbody tr:hover{background:#ffecdc}td:first-child{font-weight:700;min-width:0;white-space:nowrap}td:nth-child(2){width:80px;white-space:nowrap}td:nth-child(3){width:135px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}th:nth-child(3){text-align:right}td:nth-child(4){min-width:155px}.rest{display:block;color:#aa5519;font-size:12px;font-weight:600;margin-top:3px}@media(max-width:600px){th,td{padding:8px 9px}}</style></head><body><main class="scroll"><table><thead><tr><th>Cheval</th><th>Valeur</th><th>Gains</th><th>Entraîneur</th></tr></thead><tbody id="rows"></tbody></table></main><script>
const tbody=document.getElementById('rows');
const el=(tag,txt)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x;};
function display(data){tbody.replaceChildren();for(const h of (data.horses||[])){const tr=el('tr');const c=el('td',h.name+(h.sex&&h.age?' '+h.sex+'. PS '+h.age+' ans':''));if(h.status==='au repos'){const rest=el('span','Au repos');rest.className='rest';c.append(rest);}tr.append(c);tr.append(el('td',Number.isFinite(h.value)?String(h.value).replace('.',','):'—'));tr.append(el('td',Number.isFinite(h.gains)?new Intl.NumberFormat('fr-FR').format(h.gains)+' €':'—'));tr.append(el('td',h.trainer||'—'));tbody.append(tr);}}
fetch('data/effectif-galop.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(display).catch(()=>tbody.replaceChildren());
</script></body></html>
