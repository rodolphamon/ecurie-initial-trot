<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Effectif Galop — Écurie Initial</title>
  <meta name="description" content="Effectif Galop Écurie Initial : chevaux, casaques, valeurs, gains et entraîneurs.">
  <style>
    :root{--orange:#f47721;--dark:#171717}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;color:#222;font-family:Arial,Helvetica,sans-serif;font-size:15px}
    .scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:650px;border-collapse:collapse;background:#fff}
    thead{background:var(--dark);color:#fff}
    th,td{padding:8px 12px;border-bottom:1px solid #ececec;text-align:left;vertical-align:middle}
    th{font-weight:700;font-size:14px}
    tbody tr:nth-child(even){background:#fff7f0}
    tbody tr:hover{background:#ffecdc}
    td:first-child{font-weight:700;min-width:185px}
    td:nth-child(2){width:82px;text-align:center}
    td:nth-child(3){width:70px;white-space:nowrap}
    td:nth-child(4){width:125px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
    td:nth-child(5){min-width:160px}
    th:nth-child(4){text-align:right}
    .silk{width:59px;height:72px;object-fit:contain;vertical-align:middle}
    a{color:#a94a0a;text-decoration:underline;text-underline-offset:3px}
    .rest{display:block;color:#aa5519;font-size:12px;font-weight:600;margin-top:3px}
    @media(max-width:600px){th,td{padding:7px 9px}table{min-width:620px}}
  </style>
</head>
<body>
  <main class="scroll" aria-label="Tableau de l'effectif Galop">
    <table>
      <thead><tr><th>Cheval</th><th>Casaque</th><th>Valeur</th><th>Gains</th><th>Entraîneur</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const tbody=document.getElementById('rows');
    const euros=n=>new Intl.NumberFormat('fr-FR').format(n)+' €';
    const el=(tag,label)=>{const x=document.createElement(tag);if(label!==undefined)x.textContent=label;return x;};
    const addCell=(tr,value)=>{const td=el('td',value);tr.append(td);return td;};
    function display(data){
      tbody.replaceChildren();
      for(const h of (data.horses||[])){
        const tr=el('tr');
        const c=addCell(tr);
        const label=h.name+(h.sex&&h.age?' '+h.sex+'. PS '+h.age+' ans':'');
        if(h.horseLink){
          const a=el('a',label);a.href=h.horseLink;a.target='_blank';a.rel='noopener noreferrer';c.append(a);
        } else {c.append(el('span',label));}
        if(h.status==='au repos'){const rest=el('span','Au repos');rest.className='rest';c.append(rest);}
        const silkCell=addCell(tr);
        const img=el('img');img.className='silk';img.src='assets/casaque-galop.svg';img.alt='Casaque galop Écurie Initial';
        silkCell.append(img);
        addCell(tr,Number.isFinite(h.value)?String(h.value).replace('.',','):'—');
        addCell(tr,Number.isFinite(h.gains)?euros(h.gains):'—');
        addCell(tr,h.trainer||'—');
        tbody.append(tr);
      }
    }
    fetch('data/effectif-galop.json',{cache:'no-store'})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(display)
      .catch(()=>{tbody.replaceChildren();});
  </script>
</body>
</html>
