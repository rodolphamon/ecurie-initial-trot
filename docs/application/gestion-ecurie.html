<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion de l’Écurie</title><style>body{margin:0;background:#f6f4f1;color:#222;font:16px Arial}header{background:#171717;color:white;padding:20px;border-bottom:4px solid #f47721}main{max-width:720px;margin:auto;padding:20px}a.tile{display:block;background:white;border:1px solid #ddd;border-left:4px solid #f47721;border-radius:12px;padding:20px;margin:14px 0;color:#222;text-decoration:none}small{display:block;margin-top:8px;color:#666}[hidden]{display:none!important}</style></head><body><header><strong>ÉCURIE INITIAL</strong></header><main><a href="./">← Accueil</a><h1>Gestion de l’Écurie</h1><p id="status" role="status">Vérification des autorisations…</p><a class="tile" id="sport" href="contribution/" hidden><strong>🐎 Gestion sportive des chevaux</strong><small>Engagements, gains, valeurs handicap et records</small></a><a class="tile" id="profiles" href="fiches-entraineurs.html" hidden><strong>📋 Fiches entraîneurs</strong><small>Compléter, valider et publier les fiches</small></a></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://yeecwaaizmvrhwobukfa.supabase.co','sb_publishable_xUy2EJA3u3cKWl8BB4GNPQ_qhV9Pes3');const $=id=>document.getElementById(id);try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Connectez-vous depuis l’application.');const {data:m,error}=await db.from('associes').select('actif').eq('user_id',user.id).maybeSingle();if(error||!m?.actif)throw Error('Accès non autorisé.');const [p,...s]=await Promise.all([db.rpc('ei_gestion_fiches_autorisee'),...['engagements','gains','valeurs','records'].map(section=>db.rpc('ei_peut_contribuer',{section}))]);$('profiles').hidden=p.data!==true;$('sport').hidden=!s.some(x=>x.data===true);$('status').textContent=$('profiles').hidden&&$('sport').hidden?'Aucun accès de gestion autorisé.':'Choisissez la rubrique à gérer.';}catch(e){$('status').textContent=e.message}</script></body></html>
