<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches entraîneurs · Écurie Initial</title><style>body{font:16px Arial;background:#f6f4f1;color:#222;margin:0}main{max-width:700px;margin:auto;padding:20px}h1{border-bottom:4px solid #f47721;padding-bottom:12px}label{display:block;margin:14px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}button{background:#f47721;border:0;padding:12px;border-radius:8px;font-weight:bold;margin:8px 8px 8px 0}textarea{min-height:100px}[hidden]{display:none!important}</style><main><a href="./">← Application</a><h1>Fiches entraîneurs</h1><p id="status" role="status">Vérification de votre accès…</p><section id="editor" hidden><label>Entraîneur<select id="name"></select></label><label id="newLabel" hidden>Nouvelle fiche<input id="newName"></label><form id="form"><label>Portrait (URL HTTPS)<input name="portrait" type="url"></label><label>Présentation et parcours<textarea name="presentation"></textarea></label><label>Localisation<input name="localisation"></label><label>Année d’installation<input name="annee" type="number" min="1900" max="2100"></label><label>Site Internet<input name="site" type="url"></label><label>Réseaux sociaux (liens)<textarea name="reseaux"></textarea></label><label>Collaborateurs<textarea name="collaborateurs"></textarea></label><label>Photos des installations (une URL HTTPS par ligne)<textarea name="photos"></textarea></label><button type="submit">Enregistrer le brouillon</button><button type="button" id="publish" hidden>Valider et publier</button></form></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://yeecwaaizmvrhwobukfa.supabase.co','sb_publishable_xUy2EJA3u3cKWl8BB4GNPQ_qhV9Pes3'), $=id=>document.getElementById(id), form=$('form'), status=$('status');
let manager=false;const name=()=>$('name').value==='__new__'?$('newName').value.trim():$('name').value;
async function load(){form.reset();$('newLabel').hidden=$('name').value!=='__new__';if(!name())return;const [d,p]=await Promise.all([db.from('ei_fiches_entraineurs_brouillons').select('contenu').eq('entraineur_nom',name()).maybeSingle(),db.from('ei_fiches_entraineurs_publiques').select('contenu').eq('entraineur_nom',name()).maybeSingle()]);if(d.error||p.error)throw d.error||p.error;for(const [k,v] of Object.entries(d.data?.contenu||p.data?.contenu||{})){if(form.elements.namedItem(k))form.elements.namedItem(k).value=v;}status.textContent=d.data?'Brouillon disponible.':'Fiche prête à compléter.';}
async function save(publish){if(!form.reportValidity()||!name())return;const contenu=Object.fromEntries(new FormData(form));const row={entraineur_nom:name(),contenu,modifie_le:new Date().toISOString()};const {error}=await db.from(publish?'ei_fiches_entraineurs_publiques':'ei_fiches_entraineurs_brouillons').upsert(row);if(error)throw error;if(publish){const {error:e}=await db.from('ei_fiches_entraineurs_brouillons').delete().eq('entraineur_nom',name());if(e)throw e;}status.textContent=publish?'Fiche publiée.':'Brouillon enregistré.';}
