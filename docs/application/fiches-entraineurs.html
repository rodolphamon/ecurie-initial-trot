<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches entraîneurs · Écurie Initial</title><style>body{font:16px Arial;background:#f6f4f1;color:#222;margin:0}main{max-width:700px;margin:auto;padding:20px}h1{border-bottom:4px solid #f47721;padding-bottom:12px}label{display:block;margin:14px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}button{background:#f47721;border:0;padding:12px;border-radius:8px;font-weight:bold;margin:8px 8px 8px 0}textarea{min-height:100px}[hidden]{display:none!important}</style><main><a href="./">← Application</a><h1>Fiches entraîneurs</h1><p id="status" role="status">Vérification de votre accès…</p><section id="editor" hidden><label>Entraîneur<select id="name"></select></label><label id="newLabel" hidden>Nouvelle fiche<input id="newName"></label><form id="form"><label>Photo de portrait<input id="portraitFile" type="file" accept="image/*"><input name="portrait" type="hidden"></label><div id="portraitPreview"></div><button type="button" id="clearPortrait">Retirer le portrait</button><label>Présentation et parcours<textarea name="presentation"></textarea></label><label>Localisation<input name="localisation"></label><label>Année d’installation<input name="annee" type="number" min="1900" max="2100"></label><label>Nombre de victoires en carrière<input name="victoires_carriere" type="number" min="0" step="1"></label><label>Date de référence du palmarès<input name="date_palmares" type="date"></label><p>Les victoires avec l’Écurie Initial et les succès marquants sont calculés automatiquement.</p><label>Site Internet<input name="site" type="url"></label><label>Réseaux sociaux (liens)<textarea name="reseaux"></textarea></label><label>Collaborateurs<textarea name="collaborateurs"></textarea></label><label>Photos des installations<input id="photosFiles" type="file" accept="image/*" multiple><textarea name="photos" hidden></textarea></label><div id="photosPreview"></div><button type="submit">Enregistrer le brouillon</button><button type="button" id="publish" hidden>Valider et publier</button></form></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://yeecwaaizmvrhwobukfa.supabase.co','sb_publishable_xUy2EJA3u3cKWl8BB4GNPQ_qhV9Pes3'), $=id=>document.getElementById(id), form=$('form'), status=$('status');
let manager=false;const name=()=>$('name').value==='__new__'?$('newName').value.trim():$('name').value;
async function load(){form.reset();preview();$('newLabel').hidden=$('name').value!=='__new__';if(!name())return;const [d,p]=await Promise.all([db.from('ei_fiches_entraineurs_brouillons').select('contenu').eq('entraineur_nom',name()).maybeSingle(),db.from('ei_fiches_entraineurs_publiques').select('contenu').eq('entraineur_nom',name()).maybeSingle()]);if(d.error||p.error)throw d.error||p.error;for(const [k,v] of Object.entries(d.data?.contenu||p.data?.contenu||{})){if(form.elements.namedItem(k))form.elements.namedItem(k).value=v;}preview();status.textContent=d.data?'Brouillon disponible.':'Fiche prête à compléter.';}
async function save(publish){if(busy)return;if(!form.reportValidity()||!name())return;const contenu=Object.fromEntries(new FormData(form));const row={entraineur_nom:name(),contenu,modifie_le:new Date().toISOString()};const {error}=await db.from(publish?'ei_fiches_entraineurs_publiques':'ei_fiches_entraineurs_brouillons').upsert(row);if(error)throw error;if(publish){const {error:e}=await db.from('ei_fiches_entraineurs_brouillons').delete().eq('entraineur_nom',name());if(e)throw e;}status.textContent=publish?'Fiche publiée.':'Brouillon enregistré.';}
let busy=false;
const field=k=>form.elements.namedItem(k);
const images=()=>field('photos').value.split(/\n/).filter(Boolean);
function preview(){for(const [id,values] of [['portraitPreview',[field('portrait').value].filter(Boolean)],['photosPreview',images()]]){const box=$(id);box.replaceChildren();values.forEach((v,i)=>{if(!/^(https:\/\/|data:image\/jpeg;base64,)/i.test(v))return;const img=document.createElement('img');img.src=v;img.style.cssText='width:120px;height:100px;object-fit:cover;margin:5px;border-radius:8px';box.append(img);if(id==='photosPreview'){const b=document.createElement('button');b.type='button';b.textContent='Retirer';b.onclick=()=>{field('photos').value=images().filter((_,j)=>i!==j).join('\n');preview()};box.append(b)}})}}
async function compress(file){if(file.size>30*1024*1024)throw Error('Photo trop volumineuse (30 Mo maximum).');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1400/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.76)}catch(e){throw Error('Format photo non lisible. Choisissez une image JPEG ou PNG.')}finally{URL.revokeObjectURL(url)}}
async function choose(input,portrait){if(busy)return;busy=true;const selected=name();try{status.textContent='Préparation des photos…';const files=Array.from(input.files);if(!portrait&&images().length+files.length>8)throw Error('Maximum 8 photos des installations.');const values=[];for(const f of files)values.push(await compress(f));if(selected!==name())return;if(portrait&&values.length)field('portrait').value=values[0];else if(!portrait)field('photos').value=[...images(),...values].join('\n');preview();status.textContent='Photos prêtes. Enregistrez le brouillon ou publiez.';}catch(e){status.textContent=e.message}finally{busy=false;input.value=''}}
$('portraitFile').onchange=()=>choose($('portraitFile'),true);$('photosFiles').onchange=()=>choose($('photosFiles'),false);$('clearPortrait').onclick=()=>{field('portrait').value='';preview()};
const run=f=>async()=>{try{await f()}catch(e){status.textContent='Erreur : '+e.message}};
try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Connectez-vous depuis l’application.');const m=await db.rpc('ei_gestion_fiches_autorisee');if(m.error)throw m.error;manager=m.data===true;let q=db.from('ei_entraineurs_repertoire').select('entraineur_nom');if(!manager)q=q.eq('compte_user_id',user.id);const r=await q;if(r.error)throw r.error;let names=(r.data||[]).map(x=>x.entraineur_nom);if(manager){const p=await db.from('ei_fiches_entraineurs_publiques').select('entraineur_nom');const d=await db.from('ei_fiches_entraineurs_brouillons').select('entraineur_nom');names=[...new Set([...names,...(p.data||[]).map(x=>x.entraineur_nom),...(d.data||[]).map(x=>x.entraineur_nom)])];}if(!manager&&!names.length)throw Error('Accès non autorisé.');for(const n of names.sort((a,b)=>a.localeCompare(b,'fr')))$('name').add(new Option(n,n));if(manager)$('name').add(new Option('Créer une fiche','__new__'));$('publish').hidden=!manager;$('editor').hidden=false;$('name').onchange=run(load);form.onsubmit=e=>{e.preventDefault();run(()=>save(false))()};$('publish').onclick=run(()=>save(true));await load();}catch(e){status.textContent=e.message}
</script></html>
