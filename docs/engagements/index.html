<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fffaf5">
<title>Prochains engagements | Écurie Initial</title>
<style>
:root{color-scheme:light;--orange:#ed741e;--orange-deep:#ad4c11;--ink:#282521;--sub:#665c54;--paper:#fff;--cream:#fff9f2;--line:#ecdccd;--warm:#fff0e1;--green:#1b7347;--green-bg:#e5f5ea}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}
.container{max-width:1080px;margin:0 auto;padding:17px 16px 18px}
.head{background:#fff;border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:15px;padding:19px 21px 18px;margin-bottom:16px;box-shadow:0 8px 20px rgba(81,52,28,.045)}

.head-layout{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head-titles{min-width:0;flex:1}
.head-emblem{display:block;width:88px;height:88px;max-width:25%;object-fit:contain;flex:0 0 auto}
@media(max-width:720px){.head-emblem{width:80px;height:80px}.head-layout{gap:9px}.head h1{font-size:clamp(20px,5.5vw,29px)}}
@media(max-width:390px){.head-emblem{width:68px;height:68px}.head-layout{gap:7px}.head h1{font-size:21px;letter-spacing:-.5px}}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:var(--orange-deep)}
h1{font-size:clamp(23px,4vw,35px);line-height:1.12;letter-spacing:-.6px;margin:6px 0 9px}
.subtitle{margin:0;color:var(--sub);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 17px;align-items:center}
.filter{cursor:pointer;appearance:none;border:1px solid #e8d2bd;background:#fff;color:#4b423b;border-radius:24px;padding:9px 14px;font-size:12px;font-weight:800;white-space:nowrap}
.filter[aria-pressed="true"]{color:#fff;background:var(--orange);border-color:var(--orange)}
.filter:hover:not([aria-pressed="true"]){background:#fff1e3}
.filter:focus-visible,.horse a:focus-visible{outline:3px solid #f39a5a;outline-offset:3px}
.day{margin:20px 0 10px;display:flex;align-items:center;gap:12px}
.day h2{font-size:14px;text-transform:capitalize;margin:0;font-weight:900;color:#503e31}
.day:after{content:"";height:1px;flex:1;background:#e9daca}
.events{display:grid;gap:10px}
.event{background:var(--paper);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:12px;box-shadow:0 5px 16px rgba(69,45,19,.045);overflow:hidden;padding:13px 15px;border-left:5px solid var(--orange)}
.event.is-partant{border-left-color:#43a46c}
.event.is-status-engage{border-left-color:#282521}
.event.is-status-declare{border-left-color:#3b6ba8}
.event.is-status-forfait,.event.is-status-non-partant,.event.is-status-elimine{border-left-color:#c44343}
.event.is-status-qualification{border-left-color:#b18a31}
.when{font-variant-numeric:tabular-nums;color:#8c6e54;font-weight:900;text-align:center;font-size:13px;min-width:0}
.when .time{display:block;font-size:19px;color:#c55e16;line-height:1.25;margin-top:3px}
.when .unknown{font-size:12px;font-weight:700;color:#968679}
.when .silk-icon{display:block;box-sizing:border-box;width:54px;height:65px;max-width:100%;margin:0 auto;background-repeat:no-repeat;background-position:center;background-size:contain;flex:none}
.horse{min-width:0}
.horse-heading{display:flex;align-items:baseline;gap:5px 10px;flex-wrap:wrap}
.start-time{font-size:19px;line-height:1.25;font-weight:900;color:#c55e16;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:390px){.horse-heading{gap:6px}.start-time{font-size:16px}}
.horse strong{font-size:17px;line-height:1.2;display:block;font-weight:900;letter-spacing:.2px}
.horse a{color:var(--ink);text-decoration:none}.horse a:hover{color:var(--orange-deep);text-decoration:underline}
.place{margin-top:4px;font-size:13px;color:#51473f;font-weight:700}
.race{margin-top:3px;color:#81746a;font-size:12px}
.flag{display:flex;align-items:center;justify-content:flex-start;gap:6px 12px;flex-wrap:wrap;min-width:0;margin-top:8px}
.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:var(--warm);color:#a44b0b;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.25px;border:1px solid #f2d2b4}
.pill.partant{background:var(--green-bg);border-color:#bde3c9;color:var(--green)}
.pill.engage{background:#f0efed;border-color:#d4d0cb;color:#282521}
.pill.declare{background:#e8efff;border-color:#cdd9f4;color:#345b9d}
.pill.non-partant,.pill.forfait,.pill.elimine{background:#ffebea;border-color:#f2cccc;color:#a52f2f}
.pill.qualification{background:#fff4d6;border-color:#eddbac;color:#805d1f}
.person{font-size:12px;color:#6e6053;margin:0;font-weight:700;line-height:1.35}
.empty{border-radius:13px;background:#fff;border:1px solid var(--line);padding:22px;color:#786959;text-align:center}
@media(max-width:720px){.event{grid-template-columns:56px minmax(0,1fr);gap:10px;padding:12px}.horse strong{font-size:16px}.when .time{font-size:16px}.when .silk-icon{width:49px;height:60px}.pill{font-size:10px;padding:5px 8px}.flag{margin-top:8px}}
@media(max-width:390px){.container{padding:13px 9px}.event{grid-template-columns:48px minmax(0,1fr);gap:8px;padding:10px 9px}.when{font-size:11px}.when .silk-icon{width:44px;height:54px}.horse strong{font-size:15px}.race{font-size:11px}.pill{font-size:9px;padding:4px 7px}.person{font-size:11px}.filter{padding:8px 10px}}
/* Affichage compact : trois lignes utiles à côté de la casaque. */
.event{grid-template-columns:54px minmax(0,1fr);gap:10px;padding:10px 13px;align-items:center}
.when .silk-icon{width:48px;height:58px}
.horse{display:grid;grid-template-rows:auto auto auto;gap:4px;min-width:0}
.horse-heading{display:flex;align-items:center;flex-wrap:nowrap;gap:6px;min-width:0}
.horse-heading strong{display:block;flex:0 1 auto;min-width:0;font-size:clamp(13px,3.6vw,17px);line-height:1.2}
.horse-heading a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.start-time{flex:0 0 auto;font-size:clamp(14px,3.8vw,19px);line-height:1.2}
.pill{flex:0 0 auto;margin-left:auto;white-space:nowrap;font-size:10px;line-height:1.2;padding:4px 7px}
.pill-compact{display:none}
.horse-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.horse-meta .place{display:flex;align-items:baseline;gap:3px;flex:1 1 auto;margin:0;min-width:0;font-size:12px;overflow:hidden;white-space:nowrap}
.horse-meta .place-location{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.horse-meta .place-number,.horse-meta .place-corde{flex:0 0 auto;white-space:nowrap}
.horse-meta .place-corde{color:#99501d;font-weight:800}
.horse-meta .person{margin:0;flex:none;font-size:11px;line-height:1.3;white-space:nowrap}
.horse .race{margin:0;min-width:0;font-size:11px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.race-row{display:flex;align-items:baseline;gap:8px;min-width:0}
.race-row .race{flex:1 1 auto;min-width:0}
.race-row .ferrure-code{flex:0 0 auto;margin-left:auto;font-size:11px;line-height:1.3;font-weight:800;color:#99501d;white-space:nowrap;text-align:right}
/* La corde est présentée après le numéro sur la ligne hippodrome / discipline. */
@media(max-width:720px){
 .event{grid-template-columns:50px minmax(0,1fr);gap:9px;padding:10px 11px}
 .when .silk-icon{width:46px;height:56px}
 .horse-heading{gap:5px}
 .horse-heading strong{font-size:clamp(13px,3.55vw,16px)}
 .start-time{font-size:clamp(14px,3.7vw,17px)}
 .pill{font-size:9px;padding:4px 6px}
 .pill-full{display:none}
 .pill-compact{display:inline}
 .horse-meta{gap:6px}
 .horse-meta .place{font-size:11.5px}
 .horse-meta .person{font-size:10.5px}
}
@media(max-width:390px){
 .event{grid-template-columns:43px minmax(0,1fr);gap:7px;padding:9px 8px}
 .when .silk-icon{width:42px;height:52px}
 .horse-heading{gap:4px}
 .horse-heading strong{font-size:clamp(12px,3.5vw,15px)}
 .start-time{font-size:14px}
 .pill{font-size:8px;padding:3px 5px}
 .horse-meta .place{font-size:11px}
 .horse-meta .person{font-size:10px}
 .horse .race{font-size:10.5px}
}
</style>
</head>
<body>
<div class="container">
<nav class="filters" aria-label="Filtrer le calendrier">
<button class="filter" type="button" data-filter="tous" aria-pressed="true">Tous <span id="n-tous"></span></button>
<button class="filter" type="button" data-filter="partants" aria-pressed="false">Partants <span id="n-partants"></span></button>
<button class="filter" type="button" data-filter="engagements" aria-pressed="false">Engagements <span id="n-engagements"></span></button>
</nav>
<main id="calendar" aria-live="polite"><div class="empty">Chargement du calendrier…</div></main>
</div>
<script>
(()=>{
"use strict";
const BASE="../chevaux/";
const labels={"engage":"Engagé","declare":"Déclaré partant","partant":"Partant","non-partant":"Non-partant","forfait":"Forfait","elimine":"Éliminé","qualification":"Qualification"};
const shortLabels={"engage":"Engagé","declare":"Déclaré","partant":"Partant","non-partant":"Non-partant","forfait":"Forfait","elimine":"Éliminé","qualification":"Qualif."};
const genderLabel=(status,horse,compact=false)=>{
 const female=String(horse.sex||"").trim().toUpperCase()==="F";
 if(status==="engage")return female?"Engagée":"Engagé";
 if(status==="declare")return compact?(female?"Déclarée":"Déclaré"):(female?"Déclarée partante":"Déclaré partant");
 return (compact?shortLabels:labels)[status]||labels.engage;
};
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paris=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date()).replace(" ","T");
const day=s=>new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Europe/Paris"}).format(new Date(s+"T12:00:00Z"));
let rows=[],filter="tous";
const isPartant=e=>e.statut==="partant"||e.statut==="declare";
const subset=x=>filter==="tous"||filter==="partants"&&isPartant(x.e)||filter==="engagements"&&!isPartant(x.e);
function render(){
document.getElementById("n-tous").textContent="("+rows.length+")";
document.getElementById("n-partants").textContent="("+rows.filter(x=>isPartant(x.e)).length+")";
document.getElementById("n-engagements").textContent="("+rows.filter(x=>!isPartant(x.e)).length+")";
const visible=rows.filter(subset),calendar=document.getElementById("calendar");
if(!visible.length){calendar.innerHTML='<div class="empty">Aucun événement à venir dans cette catégorie.</div>';resize();return;}
const byDate=new Map();
for(const x of visible){if(!byDate.has(x.e.date))byDate.set(x.e.date,[]);byDate.get(x.e.date).push(x);}
calendar.innerHTML=Array.from(byDate,([date,ev])=>'<section><div class="day"><h2>'+esc(day(date))+'</h2></div><div class="events">'+ev.map(({horse,id,e})=>{
const cancelled=e.reunion_annulee||(id==='andresy'&&e.date==='2026-11-18'&&/amiens/i.test(e.hippodrome||''));
 const label=cancelled?'RÉUNION ANNULÉE':genderLabel(e.statut,horse);
const time=/^\d{2}:\d{2}$/.test(e.heure||"")?e.heure.replace(":"," h "):null;
// Conserver le nom du prix pour les engagements ; alléger les cartes déclarées et partantes, quel que soit le filtre.
const detailParts=isPartant(e)?[e.type_course||e.type,e.surface,e.distance]:[e.prix||e.type,e.type_course,e.surface,e.distance];
const person=e.driver||e.jockey||"";
const isGalop=horse.casaque==="galop"||/^(?:galop|plat|obstacle)/i.test(String(horse.discipline||"").trim());
const ferrureCode=String(e.ferrure||'F4').trim().toUpperCase();
const ferrure=!isGalop&&isPartant(e)&&/^(F4|PA|PP|P4|DA|DP|D4)$/.test(ferrureCode)?ferrureCode:'';
 const detail=[e.course,...detailParts].filter(Boolean).join(' · ');
 const cordeValue=e.corde;
const corde=isGalop && (typeof cordeValue==="number"||typeof cordeValue==="string") && /^(?:[1-9]|1[0-9]|2[0-9]|3[0-9])$/.test(String(cordeValue).trim())
  ? String(Number(cordeValue)) : null;
const silkFile=horse.casaque==="galop"?"casaque-galop.svg":horse.casaque==="orange"?"casaque-orange.svg":"casaque-blanche.svg";
return '<article class="event'+(isPartant(e)?' is-partant':'')+' is-status-'+esc(Object.hasOwn(labels,e.statut)?e.statut:'engage')+'">'
+'<div class="when"><span class="silk-icon" role="img" aria-label="Casaque de '+esc(horse.name)+'" style="background-image:url(\'../assets/'+silkFile+'\')"></span></div>'
+'<div class="horse"><div class="horse-heading"><strong><a target="_blank" rel="noopener noreferrer" href="'+BASE+encodeURIComponent(id)+'/">'+esc(horse.name)+'</a></strong>'+(isPartant(e)&&time?'<span class="start-time">'+esc(time)+'</span>':'')+'<span class="pill '+esc(e.statut||"engage")+'" title="'+esc(label)+'" aria-label="'+esc(label)+'"><span class="pill-full">'+esc(label)+'</span><span class="pill-compact" aria-hidden="true">'+esc(cancelled?'ANNULÉE':genderLabel(e.statut,horse,true))+'</span></span></div>'
+'<div class="horse-meta"><span class="place" title="'+esc((e.hippodrome||"Hippodrome à confirmer")+' · '+(horse.discipline||"")+(e.numero?' · N° '+e.numero:'')+(corde?' · Corde : '+corde:''))+'"><span class="place-location">'+esc(e.hippodrome||"Hippodrome à confirmer")+' · '+esc(horse.discipline||"")+'</span>'+(e.numero?'<span class="place-number">· N° '+esc(e.numero)+'</span>':'')+(corde?'<span class="place-corde">· Corde : '+esc(corde)+'</span>':'')+'</span>'+(person?'<span class="person">'+esc(person)+'</span>':'')+'</div>'
+'<div class="race-row"><div class="race" title="'+esc(detail)+'">'+(cancelled?'<strong style="color:#b42318">RÉUNION ANNULÉE · </strong>':'')+esc(detail)+'</div>'+(ferrure?'<span class="ferrure-code" aria-label="Ferrure : '+esc(ferrure)+'">'+esc(ferrure)+'</span>':'')+'</div></div></article>'}).join("")+'</div></section>').join("");
resize();
}
function resize(){try{window.parent.postMessage({kind:"ecurie-initial-engagements-height",height:document.documentElement.scrollHeight}, "*")}catch(_){}}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(a=>a.setAttribute("aria-pressed",String(a===b)));render()}));
Promise.all(["../chevaux/data/editorial.json","../chevaux/data/chevaux.json"].map(async path=>{const r=await fetch(path+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("Accès aux données indisponible");return r.json()})).then(async ([data,profiles])=>{
try{
 const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
 const db=createClient('https://yeecwaaizmvrhwobukfa.supabase.co','sb_publishable_xUy2EJA3u3cKWl8BB4GNPQ_qhV9Pes3');
 const {data:published,error}=await db.from('ei_contributions_engagements').select('cheval_slug,engagements');
 if(error)throw error;
 const valid=new Set((profiles.horses||[]).map(h=>h.id));
 data.engagements=data.engagements||{};
 for(const row of published||[])if(valid.has(row.cheval_slug)&&Array.isArray(row.engagements))
   data.engagements[row.cheval_slug]=row.engagements;
}catch(error){console.warn('Engagements contributeurs indisponibles : données de référence conservées',error)}
const ids=new Map((profiles.horses||[]).map(x=>[x.id,x])),seen=new Set(),now=paris();
// Un forfait disparaît du calendrier dès J-2 (date locale Europe/Paris), sans supprimer la donnée.
const forfaitCutoff=new Date(now.slice(0,10)+"T12:00:00Z");
forfaitCutoff.setUTCDate(forfaitCutoff.getUTCDate()+2);
const forfaitHideThrough=forfaitCutoff.toISOString().slice(0,10);
for(const [id,engs] of Object.entries(data.engagements||{})){const horse=ids.get(id);if(!horse)continue;for(const e of Array.isArray(engs)?engs:[]){
if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date||""))continue;
if(e.statut==="forfait"&&e.date<=forfaitHideThrough)continue;
const t=/^\d{2}:\d{2}$/.test(e.heure||"")?e.heure:"23:59";
if(e.date+"T"+t<now)continue;
const key=[id,e.date,e.hippodrome||"",e.course||e.prix||e.type||""].join("|").toLowerCase();if(seen.has(key))continue;seen.add(key);rows.push({id,horse,e});
}}
rows.sort((a,b)=>(a.e.date+(a.e.heure||"23:59")).localeCompare(b.e.date+(b.e.heure||"23:59"))||a.horse.name.localeCompare(b.horse.name,"fr"));
render();
}).catch(err=>{console.error(err);document.getElementById("calendar").innerHTML='<div class="empty">Calendrier temporairement indisponible.</div>';resize()});
window.addEventListener("resize",resize);
})();
</script>
