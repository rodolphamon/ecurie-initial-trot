<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151515">
<title>Prochains engagements | Écurie Initial</title>
<style>
:root{color-scheme:dark;--orange:#ff802e;--bg:#141414;--card:#212121;--line:#404040;--white:#f7f7f7;--muted:#bdbdbd}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font:15px/1.5 Arial,Helvetica,sans-serif}
.wrap{padding:22px 16px 35px;max-width:1100px;margin:0 auto}
.kicker{font-size:11px;letter-spacing:2.8px;font-weight:800;color:var(--orange)}
h1{margin:6px 0 10px;font-size:clamp(23px,4vw,36px);letter-spacing:-.5px;line-height:1.2}
.rule{width:56px;height:4px;background:var(--orange);border-radius:5px;margin-bottom:20px}
.lead{margin:0 0 16px;color:var(--muted);font-size:13px}
.list{display:grid;gap:12px}
.entry{border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:11px;background:var(--card);padding:16px 17px;display:grid;grid-template-columns:115px minmax(130px,1.4fr) minmax(130px,1fr) minmax(145px,1fr);align-items:center;gap:14px}
.when{line-height:1.28}.date{font-size:15px;font-weight:800}.time{font-weight:900;color:var(--orange);font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.name{font-weight:900;font-size:18px;letter-spacing:.1px}.name a{color:var(--white);text-decoration:none}.name a:hover{text-decoration:underline;text-decoration-color:var(--orange)}
.meta{color:var(--muted);font-size:12px;margin-top:4px}.track{font-size:16px;font-weight:800}.race{color:var(--muted);font-size:12px;margin-top:4px}
.status{display:inline-flex;max-width:100%;font-size:11px;padding:5px 8px;border:1px solid #626262;border-radius:5px;letter-spacing:.3px;text-transform:uppercase;font-weight:900;line-height:1.3}
.status.partant{background:#173824;color:#a6f0c2;border-color:#44875c}
.status.declare{background:#172e49;color:#a5d3fb;border-color:#406891}
.status.engage{background:#303030;color:#f5f5f5;border-color:#656565}
.status.non-partant,.status.forfait,.status.elimine{background:#482222;color:#ffbebc;border-color:#a14b49}
.status.qualification{background:#54411e;color:#ffe3a1;border-color:#93733b}
.small{font-size:12px;color:var(--muted);margin:13px 0 0}
.empty{padding:25px 18px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
@media(max-width:730px){.entry{grid-template-columns:90px minmax(0,1fr);gap:9px 15px}.horse{grid-column:2}.place{grid-column:2}.details{grid-column:2}.date{font-size:13px}.time{font-size:18px}}
@media(max-width:420px){.wrap{padding:16px 12px 24px}.entry{padding:13px;grid-template-columns:77px minmax(0,1fr);gap:6px 12px}.name{font-size:16px}.track{font-size:15px}}
</style>
</head>
<body>
<main class="wrap">
<div class="kicker">ÉCURIE INITIAL</div>
<h1>Prochains engagements</h1>
<div class="rule"></div>
<p class="lead">Engagements et partants de nos trotteurs et galopeurs, par ordre chronologique.</p>
<div id="list" class="list" aria-live="polite"><div class="empty">Chargement des prochains engagements…</div></div>
<p class="small">Les engagements sont susceptibles de modifications jusqu'à la course. Les événements terminés disparaissent automatiquement.</p>
</main>
<script>
(()=>{
'use strict';
const $=sel=>document.querySelector(sel);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusMap={
"engage":{label:"Engagé",cls:"engage"},
"declare":{label:"Déclaré partant",cls:"declare"},
"partant":{label:"Partant confirmé",cls:"partant"},
"non-partant":{label:"Non-partant",cls:"non-partant"},
"forfait":{label:"Forfait",cls:"forfait"},
"elimine":{label:"Éliminé",cls:"elimine"},
"qualification":{label:"Qualification",cls:"qualification"}
};
const parsian=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).replace(' ','T');
const day=date=>{let dt=new Date(date+'T12:00:00Z');return Number.isNaN(dt.valueOf())?date:new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'Europe/Paris'}).format(dt)};
const hour=h=>/^\d\d:\d\d$/.test(h||'')?h.replace(':',' h '):'Horaire à confirmer';
async function start(){
const [ep,cp]=await Promise.all(['../chevaux/data/editorial.json','../chevaux/data/chevaux.json'].map(async url=>{
const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Chargement des données indisponible');return r.json();
}));
const horses=new Map((cp.horses||[]).map(h=>[h.id,h]));
const now=parsian();
const events=[],seen=new Set();
for(const [id,rows] of Object.entries(ep.engagements||{})){
const horse=horses.get(id);if(!horse)continue;
for(const e of Array.isArray(rows)?rows:[]){
if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date||''))continue;
if(e.date+'T'+(/^\d{2}:\d{2}$/.test(e.heure||'')?e.heure:'23:59')<now)continue;
const key=[id,e.date,e.hippodrome,e.course||e.prix||e.type||''].join('|').toLowerCase();
if(seen.has(key))continue;
seen.add(key);events.push({horse,id,e});
}}
events.sort((a,b)=>{let d=(a.e.date+(a.e.heure||'23:59')).localeCompare(b.e.date+(b.e.heure||'23:59'));return d||a.horse.name.localeCompare(b.horse.name,'fr')});
if(!events.length){$('#list').innerHTML='<div class="empty">Aucun engagement à venir renseigné pour le moment.</div>';return;}
$('#list').innerHTML=events.map(({horse,id,e})=>{
const stat=statusMap[e.statut]||(e.type==='Qualification'?statusMap.qualification:statusMap.engage);
const race=[e.course,e.prix||e.type].filter(Boolean).join(' · ');
const person=e.driver||e.jockey||'';
return '<article class="entry">'
+'<div class="when"><div class="date">'+esc(day(e.date))+'</div><div class="time">'+esc(hour(e.heure))+'</div></div>'
+'<div class="horse"><div class="name"><a href="../chevaux/'+encodeURIComponent(id)+'/" target="_blank" rel="noopener noreferrer">'+esc(horse.name)+'</a></div><div class="meta">'+esc(horse.discipline||'')+(e.numero?' · N° '+esc(e.numero):'')+'</div></div>'
+'<div class="place"><div class="track">'+esc(e.hippodrome||'Hippodrome à confirmer')+'</div><div class="race">'+esc(race)+'</div></div>'
+'<div class="details"><span class="status '+stat.cls+'">'+stat.label+'</span>'+(person?'<div class="meta">'+esc(person)+'</div>':'')+'</div>'
+'</article>'}).join('');
}
start().catch(e=>{$('#list').innerHTML='<div class="empty">Impossible de charger le calendrier pour le moment. Actualisez la page pour réessayer.</div>';console.error(e)});
})();
</script>
</body></html>
