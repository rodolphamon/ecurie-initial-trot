<style>
:root{--orange:#f47721;--ink:#191919;--muted:#667085;--line:#ececee;--soft:#fff6ef}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink);font-family:Arial,Helvetica,sans-serif;max-width:100%;overflow-x:hidden}body{padding:clamp(10px,2.4vw,26px)}
.palmares{max-width:1140px;width:100%;margin:auto;min-width:0}.top{background:#191919;color:#fff;padding:24px clamp(18px,3.5vw,38px);border-radius:16px;border-top:6px solid var(--orange);display:flex;align-items:center;justify-content:space-between;gap:16px}
.top h1{font-size:clamp(26px,5vw,41px);line-height:1;letter-spacing:.035em;margin:0;font-weight:900}
#counter{font-size:clamp(39px,7vw,70px);font-weight:900;line-height:1;letter-spacing:-.055em;color:#ff862c;font-variant-numeric:tabular-nums}
.controls{margin-top:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.controls label{min-width:0}.controls label:first-child,.controls label:nth-child(4),.controls .trainer-filter{grid-column:span 2}
.controls input,.controls select{width:100%;padding:13px 12px;border:1px solid #d7d7dc;background:white;border-radius:9px;font:inherit;color:#252525;min-width:0;outline-color:var(--orange);font-size:14px}
.caption-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 1px 10px}.result{font-size:13px;color:#595959}.legend{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;background:#f8f8f8;border:1px solid #ebebeb;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:inherit;transition:background .16s ease,border-color .16s ease}.legend .tag[aria-pressed="true"]{border-color:var(--orange);background:var(--soft);color:#9c4712;box-shadow:0 0 0 1px var(--orange)}.legend .tag:hover{background:#fff0e3}.legend .tag:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.tag .disc-img{width:36px;height:25px;margin-right:2px}.tag .disc-text{font-size:12px}
.tablewrap{border:1px solid #e9e9ea;border-radius:12px;overflow-x:auto;background:#fff}
table{width:100%;border-collapse:collapse;min-width:840px;text-align:left}thead{background:#262626;color:#fff}th{padding:14px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;white-space:nowrap}td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.3}tbody tr:nth-child(even){background:#fff9f5}tbody tr:hover{background:#fff0e3}tbody tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:center;width:75px}td.date{white-space:nowrap;font-variant-numeric:tabular-nums;color:#515151;font-weight:650}td.place{color:#454545}td.horse{font-weight:850;color:#161616}td.person{color:#5d5d62}.table-trainer{display:block;color:#727277;font-size:12px;margin-top:5px;white-space:normal}td.discipline{white-space:nowrap;font-weight:700}
.robe{width:43px;height:52px;object-fit:contain;vertical-align:middle}.disc-img{width:43px;height:31px;object-fit:contain;vertical-align:middle;margin-right:6px}.disc-text{vertical-align:middle}
.empty{padding:32px;text-align:center;color:var(--muted)}.nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:15px}.nav button{padding:10px 16px;background:#232323;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.nav button:disabled{opacity:.3;cursor:default}.nav span{font-size:13px;color:#555;min-width:94px;text-align:center}
.fineprint{margin:17px 0 0;font-size:12px;line-height:1.65;color:#686868}.fineprint strong{color:#494949}abbr{border:0;text-decoration:none;cursor:help}
.rank-cell{text-align:center;font-size:25px;white-space:nowrap;width:55px}.pal-card-medal{font-size:27px;line-height:1.1;display:block;text-align:center;margin:3px 0}.pal-card-silk{flex-direction:column;gap:2px}
/* La table reste dédiée aux ordinateurs; sur téléphone chaque victoire possède une vraie fiche. */
.cards{display:none}
.pal-card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:1px solid #e9e7e5;border-left:4px solid var(--orange);border-radius:12px;box-shadow:0 3px 12px rgba(33,24,16,.035);min-width:0}
.pal-card:nth-child(even){background:#fffbf8}
.pal-card-silk{display:flex;align-items:center;justify-content:center;min-height:0;padding-top:0}
.pal-card-silk .robe{height:54px;width:46px;object-fit:contain}
.pal-card-main{min-width:0;display:flex;flex-direction:column;justify-content:center}
.pal-card-head{display:contents}
.pal-card-date{display:block;margin-bottom:9px;font-size:12px;font-weight:800;color:#b95819;font-variant-numeric:tabular-nums}
.pal-card-name{font-size:17px;font-weight:900;line-height:1.25;color:#1d1d1d;overflow-wrap:anywhere}
.pal-card-place{font-size:13px;color:#66616a;margin-top:5px;line-height:1.35;overflow-wrap:anywhere}
.pal-card-jockey{font-size:13px;color:#37383e;margin-top:6px;line-height:1.35;font-weight:600}
.pal-card-jockey-label{font-weight:500;color:#7d7d83;margin-right:5px}.pal-card-trainer{font-size:12px;line-height:1.35;color:#5f6065;margin-top:5px;overflow-wrap:anywhere}.pal-card-trainer-label{font-weight:500;color:#7d7d83;margin-right:5px}
.replay-link{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 10px;border:1px solid #e5ba92;border-radius:999px;background:#fff5ed;color:#9c4712;font-size:12px;font-weight:800;text-decoration:none;line-height:1;white-space:nowrap}
.replay-link svg{width:21px;height:19px;flex-shrink:0}
.replay-link:hover,.replay-link:focus-visible{background:#f9d8bf;color:#72310c}
.pal-card-replay{margin:0}.pal-card-actions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex-shrink:0;align-self:center;margin-top:0}.pal-card-actions .replay-link{padding:5px 8px;font-size:11px}.video-cell{text-align:center;width:94px}.video-cell .replay-link{padding:6px 9px}
.pal-card-disc{display:inline-flex;align-items:center;gap:2px;white-space:nowrap;padding:4px 8px;border-radius:20px;background:#fff5ec;border:1px solid #f5e5d7;color:#8f4517;font-size:12px;font-weight:800}
.pal-card-disc .disc-img{width:25px;height:19px;margin:0;object-fit:contain}
.pal-card-disc.is-unclassified{background:#f4f4f4;border-color:#ececec;color:#636363}
@media(max-width:790px){
 body{padding:9px}
 .top{padding:16px 18px;border-radius:12px}
 .top h1{font-size:clamp(24px,7vw,34px)}
 #counter{font-size:clamp(39px,10vw,58px)}
 .controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
 .controls label:first-child,.controls label:nth-child(4),.controls label:nth-child(5),.controls .trainer-filter,.controls label:last-child{grid-column:1/-1}
 .controls input,.controls select{padding:12px 10px;min-width:0;font-size:13px}
 .caption-line{align-items:flex-start;flex-direction:column;margin:13px 1px 12px;gap:10px}
 .legend{gap:5px}
 .tag{padding:4px 8px}
 .tablewrap{display:none}
 .cards{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
 .fineprint{font-size:11px}
 .nav{gap:10px}
}
@media(max-width:370px){
 .pal-card{grid-template-columns:42px minmax(0,1fr) auto;gap:7px;padding:10px 9px}
 .pal-card-silk .robe{height:49px;width:40px}
 .pal-card-name{font-size:16px}
 .pal-card-disc{font-size:11px;padding:4px 6px}
 .top{padding:15px 12px}
}
.placing-tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.placing-tabs button{padding:10px 16px;border:1px solid #ddd;border-radius:9px;background:white;font:700 13px Arial;cursor:pointer}.placing-tabs button[aria-pressed="true"]{background:#191919;color:#fff;border-color:#191919}.placing-stats{margin-top:12px;font-size:13px;font-weight:700;color:#565656}.placing{display:inline-block;background:#fff0df;color:#a34c0e;border-radius:6px;padding:3px 6px;font-size:12px;white-space:nowrap}.top{display:flex;flex-direction:column;align-items:stretch;gap:12px}.medal-counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}.medal-item{display:flex;justify-content:center;align-items:center;gap:8px;min-width:0}.medal-emoji{font-size:clamp(26px,5vw,44px)}.medal-item output{font-size:clamp(26px,5vw,52px);font-weight:900;line-height:1.1;color:#ff862c;font-variant-numeric:tabular-nums}.medal-total{text-align:center;font-size:14px;color:#f1f1f1}.medal-total strong{color:#ff862c;font-size:18px}@media(max-width:440px){.medal-counts{gap:4px}.medal-item{gap:4px}.medal-emoji{font-size:26px}.medal-item output{font-size:29px}}.medal{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;box-sizing:border-box;font:800 12px/1 Arial,sans-serif;letter-spacing:-.3px;color:#5c3b0a;background:linear-gradient(145deg,#fff1b7 0%,#e8b844 40%,#bd8322 76%,#f6d779 100%);border:1px solid #b88a31;box-shadow:inset 0 1px 1px #fff9,inset 0 -1px 1px #71430055,0 1px 2px #0002;vertical-align:middle;flex-shrink:0}.medal-2{color:#3f4852;background:linear-gradient(145deg,#fff 0%,#d8dfe5 40%,#9ba5ae 76%,#e8edf1 100%);border-color:#a2abb4}.medal-3{color:#61391f;background:linear-gradient(145deg,#f7d5b4 0%,#c98a5d 40%,#95552f 76%,#e8af83 100%);border-color:#a66c46}.medal-group{display:inline-flex;gap:3px;align-items:center}.placing-tabs button{display:inline-flex;align-items:center;justify-content:center;gap:7px}.rank-cell .medal{wi function nomProprietaire(s){
 return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
}
function victoireAdmiseAuCompteur(r){
 if(r.compteInitial===false)return false;
 // Les casaques de tiers restent visibles mais ne sont jamais comptabilisées.
 if(["julien","homa"].includes(r.casaque))return false;
 const discipline=["galop","obstacle"].includes(r.discipline)?"galop":["attele","monte","trot"].includes(r.discipline)?"trot":null;
 if(!discipline)return false;
 // Si le propriétaire est identifié, sa valeur fait foi, pas la casaque ni le jockey.
 if(r.proprietaire)return proprietairesAdmis[discipline].has(nomProprietaire(r.proprietaire));
 // Historique : attribution validée via la casaque de chaque victoire.
 // Les succès sous d'autres couleurs (JULIEN, HOMA, etc.) restent exclus.
 if(!archivesInitiales.has(r)&&!podiumsConfirmes.has(r))return false;
 return discipline==="galop"?r.casaque==="galop":["historique","nathalie","blanche"].includes(r.casaque);
}

// L'ancien visuel galop a un fond gris intégré aux pixels de l'image.
// On retire seulement les gris extérieurs, sans redessiner la casaque.
function fondTransparentCasaqueGalop(){
 const img=new Image();
 img.onload=()=>{
  try{
   const canvas=document.createElement("canvas");
   canvas.width=160;canvas.height=190;
   const ctx=canvas.getContext("2d",{willReadFrequently:true});
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
   const d=pixels.data,w=canvas.width,h=canvas.height;
   const seen=new Uint8Array(w*h),queue=new Int32Array(w*h);
   let head=0,tail=0;
   function visit(i){
    if(seen[i])return;
    seen[i]=1;
    const p=i*4,r=d[p],g=d[p+1],b=d[p+2];
    const light=(r+g+b)/3;
    // Le fond gris est neutre et relié aux bords de l'image.
    if(d[p+3]>0 && light>105 && light<246 && Math.max(r,g,b)-Math.min(r,g,b)<25){
     d[p+3]=0;
     queue[tail++]=i;
    }
   }
   for(let x=0;x<w;x++){visit(x);visit((h-1)*w+x)}
   for(let y=0;y<h;y++){visit(y*w);visit(y*w+w-1)}
   while(head<tail){
    const i=queue[head++],x=i%w,y=(i/w)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
     if(!dx&&!dy)continue;
     const nx=x+dx,ny=y+dy;
     if(nx>=0&&nx<w&&ny>=0&&ny<h)visit(ny*w+nx);
    }
   }
   // Préserve le fichier original s'il est déjà sur fond transparent.
   if(tail<w*h*0.08)return;
   ctx.putImageData(pixels,0,0);
   silkFiles.galop=canvas.toDataURL("image/png");
   render();
  }catch(e){/* Conserve l'image d'origine en cas d'échec. */}
 };
 img.src=silkFiles.galop;
}

function disc(type){
 const names={attele:"Attelé",monte:"Monté",galop:"Galop",obstacle:"Obstacle",trot:"Trot"};

 return (src?'<img class="disc-img" src="'+src+'" alt="" loading="lazy">':'')+'<span class="disc-text"'+(type==="trot"?' title="Discipline exacte à confirmer"':'')+'>'+label+'</span>';

// Les vidéos restent hébergées par LeTROT : nous ne stockons que les liens.
function replayUrl(value){
 try{
  const url=new URL(String(value||""));
  if(url.protocol!=="https:")return "";
  const letrot=url.hostname==="www.letrot.com"&&(/^\/courses\/\d{4}-\d{2}-\d{2}\/\d+\/\d+\/?$/.test(url.pathname)||/^\/fr\/courses\/replay-courses\/\d{4}-\d{2}-\d{2}\/\d+\/\d+\/?$/.test(url.pathname));
  const equidia=url.hostname==="www.equidia.fr"&&/^\/courses\/\d{4}-\d{2}-\d{2}\/R\d+\/C\d+\/?$/.test(url.pathname);
  const archive=url.hostname==="www.dailymotion.com"&&/^\/video\/[a-zA-Z0-9]+\/?$/.test(url.pathname);
  return letrot||equidia||archive?url.href:"";
 }catch{return ""}
}
function replayButton(result,mobile){
 const url=replayUrl(result.video);
 if(!url)return "";
 const svg='<svg viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="17" rx="4" stroke="currentColor" stroke-width="1.7"/><path d="m10 6 6.2 4L10 14V6Z" fill="currentColor"/></svg>';
 const title="Voir le replay de "+result.cheval+" du "+result.date.split("-").reverse().join("/");
 const link='<a class="replay-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" title="Voir la vidéo de la course" aria-label="'+esc(title)+'">'+svg+'<span>Vidéo</span></a>';
 return mobile?'<div class="pal-card-replay">'+link+'</div>':link;
}
async function loadReplays(){
 try{
  const response=await fetch("./replays.json",{cache:"no-store"});
  if(!response.ok)throw Error("Replays non disponibles");
  const obj=await response.json();
  const candidates=Array.isArray(obj.replays)?obj.replays:[];
  const byRace=new Map(results.map(r=>[[r.date,r.cheval,r.hippodrome].join("|").toUpperCase(),r]));
  for(const video of candidates){
    if(!video||!video.date||!video.cheval||!video.hippodrome)continue;
    const normalizeReplayKey=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    const candidatesForHorse=results.filter(r=>r.date===video.date&&normalizeReplayKey(r.cheval)===normalizeReplayKey(video.cheval));
    const row=byRace.get([video.date,video.cheval,video.hippodrome].join("|").toUpperCase())||(candidatesForHorse.length===1?candidatesForHorse[0]:null);
    const url=replayUrl(video.url);
    if(row&&url)row.video=url;
  }
  render();
 }catch(err){/* Aucun pictogramme tant que le lien direct n'est pas vérifié. */}
}
const state={page:1,perPage:25,discipline:"",placing:"all",videoOnly:false};
function render(){
 const fold=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("fr");
 const q=fold($("search").value.trim()),year=$("year").value,type=state.discipline,horse=$("horse").value,pilot=$("pilot").value,trainerQuery=fold($("trainer").value.trim());
 const data=results.filter(r=>(!state.videoOnly||!!replayUrl(r.video))&&(state.placing==="all"||(state.placing==="win"?(r.classement||1)===1:state.placing==="second"?(r.classement||1)===2:(r.classement||1)===3))&&(!year||r.date.slice(0,4)===year)&&(!type||r.discipline===type)&&(!horse||r.cheval===horse)&&(!pilot||r.jockey===pilot)&&(!trainerQuery||fold(r.entraineur).includes(trainerQuery))&&(!q||[r.cheval,r.hippodrome,r.jockey,r.entraineur,r.date].some(v=>fold(v).includes(q))))
 .sort((a,b)=>$("order").value==="desc"?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
 const pages=Math.max(1,Math.ceil(data.length/state.perPage));
 state.page=Math.min(state.page,pages);
 const list=data.slice((state.page-1)*state.perPage,state.page*state.perPage);
 const dateFR=d=>d.split("-").reverse().join("/");
 // Affichage de la table sur ordinateur : colonnes classiques.
 $("rows").innerHTML=list.map(r=>'<tr><td>'+jersey(casaquePourCourse(r))+'</td><td class="rank-cell" aria-label="'+(r.classement||1)+'e place">'+medaille(r)+'</td><td class="date">'+esc(dateFR(r.date))+'</td><td class="place">'+esc(r.hippodrome)+'</td><td class="horse">'+esc(r.cheval)+'</td><td class="person">'+(r.jockey?esc(r.jockey):'—')+'<div class="table-trainer">Entraîneur : '+esc(r.entraineur||'—')+'</div></td><td class="discipline">'+disc(r.discipline)+'</td><td class="video-cell">'+replayButton(r,false)+'</td></tr>').join("");
 // Sur mobile : vraies fiches sans défilement horizontal, ni texte coupé.
 $("cards").innerHTML=list.map(r=>{
  const label=(r.discipline==="galop"||r.discipline==="obstacle"||r.discipline==="monte")?"Jockey":r.discipline==="attele"?"Driver":"Jockey / Driver";
  const jockey=r.jockey?'<div class="pal-card-jockey"><span class="pal-card-jockey-label">'+label+' :</span>'+esc(r.jockey)+'</div>':"";
  const trainer='<div class="pal-card-trainer"><span class="pal-card-trainer-label">Entraîneur :</span>'+esc(r.entraineur||"—")+'</div>';
  return '<article class="pal-card"><div class="pal-card-silk">'+jersey(casaquePourCourse(r))+'</div><div class="pal-card-main"><time class="pal-card-date" datetime="'+esc(r.date)+'">'+esc(dateFR(r.date))+'</time><div class="pal-card-name">'+esc(r.cheval)+'</div><div class="pal-card-place">'+esc(r.hippodrome)+'</div>'+jockey+trainer+'</div><div class="pal-card-actions"><span class="pal-card-disc'+(r.discipline==="trot"?' is-unclassified':'')+'">'+disc(r.discipline)+'</span><span class="pal-card-medal" aria-label="Classement : '+(r.classement||1)+'">'+medaille(r)+'</span>'+replayButton(r,true)+'</div></article>';
 }).join("");
 for(const button of $("legend").querySelectorAll("button[data-discipline]"))button.setAttribute("aria-pressed",button.dataset.discipline===state.discipline?"true":"false");
 $("empty").hidden=data.length>0;
 $("count").textContent=(!q&&!year&&!type&&!horse&&!pilot&&!trainerQuery)?"Toutes les courses de nos archives":data.length+" course"+(data.length>1?"s":"")+" trouvée"+(data.length>1?"s":"");
 $("page").textContent="Page "+state.page+" / "+pages;
 $("prev").disabled=state.page===1;$("next").disabled=state.page===pages;
 postHeight();
}
function refreshYears(){
 const yearSelect=$("year"),previous=yearSelect.value;
 yearSelect.innerHTML='<option value="">Année</option>';
 const years=[...new Set(results.map(r=>r.date.slice(0,4)))].sort((a,b)=>b.localeCompare(a));
 for(const year of years){const o=document.createElement("option");o.value=year;o.textContent=year;yearSelect.appendChild(o)}
 yearSelect.value=years.includes(previous)?previous:"";
}
refreshYears();
function refreshNameFilters(){
 const horseSelect=$("horse"),pilotSelect=$("pilot");
 function fill(select,values,allLabel,sortFn){
  const previous=select.value;
  select.replaceChildren(new Option(allLabel,""));
  for(const value of [...new Set(values.filter(Boolean))].sort(sortFn)){
   select.add(new Option(value,value));
  }
  select.value=[...select.options].some(o=>o.value===previous)?previous:"";
 }
 const alphabetic=(a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"});
 const bySurname=(a,b)=>{
  const family=name=>name.trim().split(/\s+/).at(-1);
  return alphabetic(family(a),family(b))||alphabetic(a,b);
 };
 fill(horseSelect,results.map(r=>r.cheval),"Cheval",alphabetic);
 fill(pilotSelect,results.map(r=>r.jockey),"Jockey / Driver",bySurname);
 const trainerList=$("trainer-suggestions");
 trainerList.replaceChildren();
 for(const name of [...new Set(results.map(r=>r.entraineur).filter(Boolean))].sort(alphabetic)){
  const option=document.createElement("option");option.value=name;trainerList.appendChild(option);
 }
}
refreshNameFilters();
// Référence validée par le propriétaire. Deux lignes anciennes avec casaque blanche
// restent à rapprocher : ne pas supprimer une course ni inventer laquelle est hors total.
// Calcul sur les lignes attribuées aux cinq catégories admises,
// vérifiées individuellement contre la liste officielle des 130 succès de l'Écurie Initial au trot.
function updateCounter(){
 const admis=results.filter(victoireAdmiseAuCompteur);
 const total=admis.filter(r=>(r.classement||1)===1).length;
 const seconds=admis.filter(r=>r.classement===2).length;
 const thirds=admis.filter(r=>r.classement===3).length;
 $("counter").textContent=new Intl.NumberFormat("fr-FR").format(total);
 $("silverCounter").textContent=seconds;
 $("bronzeCounter").textContent=thirds;
 $("allPodiums").textContent=new Intl.NumberFormat("fr-FR").format(total+seconds+thirds);

}
async function loadPodiums(){try{const response=await fetch("./podiums.json",{cache:"no-store"});if(!response.ok)throw Error();const json=await response.json();const keys=new Set(results.map(v=>[v.date,v.cheval,v.hippodrome].join("|").toUpperCase()));for(const p of json.podiums||[]){if(!p||![2,3].includes(p.classement)||!/^\d{4}-\d{2}-\d{2}$/.test(p.date||"")||!p.cheval||!p.hippodrome)continue;const key=[p.date,p.cheval,p.hippodrome].join("|").toUpperCase();if(keys.has(key))continue;keys.add(key);const podium={...p,jockey:p.jockey||"",entraineur:p.entraineur||"",casaque:p.casaque||"blanche"};results.push(podium);podiumsConfirmes.add(podium)}refreshYears();refreshNameFilters();updateCounter();render()}catch(e){/* Le palmarès des victoires reste disponible. */}}
async function loadNewVictories(){
 // Une ligne du fichier = un nouveau succès approuvé après la date de référence.
 try{
  const response=await fetch("./victoires-a-ajouter.json",{cache:"no-store"});
  if(!response.ok)throw Error("Fichier de victoires non disponible");
  const json=await response.json();
  const raw=Array.isArray(json.victoires)?json.victoires:[];
  const add=raw.filter(v=>v && /^\d{4}-\d{2}-\d{2}$/.test(v.date||"") && typeof v.cheval==="string" && v.cheval.trim() && typeof v.hippodrome==="string" && v.hippodrome.trim()).map(v=>({
   date:v.date,cheval:v.cheval.trim(),hippodrome:v.hippodrome.trim(),
   discipline:["attele","monte","galop","obstacle","trot"].includes(v.discipline)?v.discipline:"trot",
   jockey:typeof v.jockey==="string"?v.jockey.trim():"",
   entraineur:typeof v.entraineur==="string"?v.entraineur.trim():"",
   casaque:Object.hasOwn(silkFiles,v.casaque)?v.casaque:"blanche",
   proprietaire:typeof v.proprietaire==="string"?v.proprietaire.trim():"",
   compteInitial:v.compteInitial!==false
  }));
  const keys=new Set(results.map(v=>[v.date,v.cheval,v.hippodrome].join("|").toUpperCase()));
  const unique=add.filter(v=>{const key=[v.date,v.cheval,v.hippodrome].join("|").toUpperCase();if(keys.has(key))return false;keys.add(key);return true});
  results.push(...unique);updateCounter();refreshYears();refreshNameFilters();render();
 }catch(err){updateCounter()}
}
// Ces boutons sont des filtres locaux, jamais des liens vers un site extérieur.
$("legend").innerHTML=["attele","monte","galop","obstacle"].map(t=>'<button type="button" class="tag" data-discipline="'+t+'" aria-pressed="false" title="Filtrer par '+{attele:"Attelé",monte:"Monté",galop:"Galop",obstacle:"Obstacle"}[t]+'">'+disc(t)+'</button>').join("");
