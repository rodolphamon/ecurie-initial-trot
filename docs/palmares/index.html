<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palmarès historique | Écurie Initial</title>
<style>
:root{--orange:#f47721;--ink:#191919;--muted:#667085;--line:#ececee;--soft:#fff6ef}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink);font-family:Arial,Helvetica,sans-serif;max-width:100%;overflow-x:hidden}body{padding:clamp(10px,2.4vw,26px)}
.palmares{max-width:1140px;width:100%;margin:auto;min-width:0}.top{background:#fffaf5;color:#25211f;padding:24px clamp(18px,3.5vw,38px);border:1px solid #ecd9ca;border-radius:16px;border-top:6px solid var(--orange);box-shadow:0 4px 16px rgba(64,41,22,.06);display:flex;align-items:center;justify-content:space-between;gap:16px}

.controls{margin-top:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.controls label{min-width:0}.controls label:nth-child(3),.controls .trainer-filter,.controls .hippodrome-filter{grid-column:span 2}.controls label:last-child{grid-column:1/-1}
.controls input,.controls select{width:100%;padding:13px 12px;border:1px solid #d7d7dc;background:white;border-radius:9px;font:inherit;color:#252525;min-width:0;outline-color:var(--orange);font-size:14px}
.caption-line{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:12px 1px 10px}.result{font-size:clamp(16px,2.2vw,19px);font-weight:800;line-height:1.3;color:#171717;width:100%;text-align:center}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%}
.tag{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;background:#f8f8f8;border:1px solid #ebebeb;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:inherit;transition:background .16s ease,border-color .16s ease}.legend .tag[aria-pressed="true"]{border-color:var(--orange);background:var(--soft);color:#9c4712;box-shadow:0 0 0 1px var(--orange)}.legend .tag:hover{background:#fff0e3}.legend .tag:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.tag .disc-img{width:36px;height:25px;margin-right:2px}.tag .disc-text{font-size:12px}
.tablewrap{border:1px solid #e9e9ea;border-radius:12px;overflow-x:auto;background:#fff}
table{width:100%;border-collapse:collapse;min-width:840px;text-align:left}thead{background:#262626;color:#fff}th{padding:14px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;white-space:nowrap}td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.3}tbody tr:nth-child(even){background:#fff9f5}tbody tr:hover{background:#fff0e3}tbody tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:center;width:75px}td.date{white-space:nowrap;font-variant-numeric:tabular-nums;color:#515151;font-weight:650}td.place{color:#454545}td.horse{font-weight:850;color:#161616}td.person{color:#5d5d62}.table-trainer{display:block;color:#727277;font-size:12px;margin-top:5px;white-space:normal}td.discipline{white-space:nowrap;font-weight:700}
.robe{width:43px;height:52px;object-fit:contain;vertical-align:middle}.disc-img{width:43px;height:31px;object-fit:contain;vertical-align:middle;margin-right:6px}.disc-text{vertical-align:middle}
.empty{padding:32px;text-align:center;color:var(--muted)}.nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:15px}.nav button{padding:10px 16px;background:#232323;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.nav button:disabled{opacity:.3;cursor:default}.nav span{font-size:13px;color:#555;min-width:94px;text-align:center}
.fineprint{margin:17px 0 0;font-size:12px;line-height:1.65;color:#686868}.fineprint strong{color:#494949}abbr{border:0;text-decoration:none;cursor:help}
.rank-cell{text-align:center;font-size:25px;white-space:nowrap;width:55px}.pal-card-medal{font-size:27px;line-height:1.1;display:block;text-align:center;margin:1px 0}.pal-card-silk{flex-direction:column;gap:2px}
/* La table reste dédiée aux ordinateurs; sur téléphone chaque victoire possède une vraie fiche. */
.cards{display:none}
.pal-card{display:grid;grid-template-columns:68px minmax(0,1fr) 82px;grid-template-rows:auto auto;column-gap:7px;row-gap:3px;align-items:start;padding:9px 11px;background:#fff;border:1px solid #e9e7e5;border-left:4px solid var(--orange);border-radius:12px;box-shadow:0 3px 12px rgba(33,24,16,.035);min-width:0}
.pal-card:nth-child(even){background:#fffbf8}
.pal-card-date{grid-column:1;grid-row:1;align-self:center;justify-self:start;display:block;font-size:12px;font-weight:800;color:#b95819;font-variant-numeric:tabular-nums;white-space:nowrap}
.pal-card-name{grid-column:2 / 4;grid-row:1;align-self:center;min-width:0;font-size:17px;font-weight:900;line-height:1.25;color:#1d1d1d;white-space:nowrap}
.pal-card-silk{grid-column:1;grid-row:2;display:flex;align-items:flex-start;justify-content:center;min-height:0;padding-top:9px}
.pal-card-silk .robe{height:54px;width:46px;object-fit:contain}
.pal-card-main{grid-column:2;grid-row:2;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;padding-top:0}
.pal-card-actions{grid-column:3;grid-row:2}
.pal-card-place{font-size:13px;color:#66616a;margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.pal-card-jockey{font-size:13px;color:#37383e;margin-top:4px;line-height:1.35;font-weight:600;white-space:nowrap}
.pal-card-jockey-label{font-weight:500;color:#7d7d83;margin-right:5px}.pal-card-trainer{font-size:12px;line-height:1.35;color:#5f6065;margin-top:3px;white-space:nowrap}.pal-card-trainer-label{font-weight:500;color:#7d7d83;margin-right:5px}
.replay-link{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 10px;border:1px solid #e5ba92;border-radius:999px;background:#fff5ed;color:#9c4712;font-size:12px;font-weight:800;text-decoration:none;line-height:1;white-space:nowrap}
.replay-link svg{width:21px;height:19px;flex-shrink:0}
.replay-link:hover,.replay-link:focus-visible{background:#f9d8bf;color:#72310c}
.replay-unavailable{display:inline-block;padding:4px 2px;text-align:center;color:#8d8781;font-size:10px;font-weight:600;white-space:nowrap}
.pal-card-replay{margin:0}.pal-card-actions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0;align-self:start;margin-top:-28px;min-width:0;width:100%}.pal-card-actions .replay-link{padding:4px 6px;font-size:11px}.video-cell{text-align:center;width:94px}.video-cell .replay-link{padding:6px 9px}
.pal-card-disc{display:inline-flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap;padding:4px 3px;border-radius:20px;background:#fff5ec;border:1px solid #f5e5d7;color:#8f4517;font-size:11px;font-weight:800;max-width:100%}
.pal-card-disc .disc-img{width:20px;height:18px;margin:0;object-fit:contain}
.pal-card-disc.is-unclassified{background:#f4f4f4;border-color:#ececec;color:#636363}
@media(max-width:790px){
 body{padding:9px}
 .top{padding:16px 18px;border-radius:12px}
 .top h1{font-size:clamp(24px,7vw,34px)}
 #counter{font-size:clamp(39px,10vw,58px)}
 .controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
 .controls label:nth-child(3),.controls .trainer-filter,.controls .hippodrome-filter,.controls label:last-child{grid-column:auto}
 .controls input,.controls select{padding:11px 9px;min-width:0;font-size:12px;white-space:nowrap}
 .caption-line{align-items:flex-start;flex-direction:column;margin:13px 1px 12px;gap:10px}
 .caption-line .legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;gap:5px}
 .caption-line .legend .tag{width:100%;min-width:0;min-height:43px;justify-content:center;gap:3px;padding:7px 3px;border-radius:11px;white-space:nowrap}
 .caption-line .legend .tag .disc-img{width:22px;height:21px;flex:0 0 22px;margin-right:0;object-fit:contain}
 .caption-line .legend .tag .disc-text{font-size:11px;white-space:nowrap}

 .tablewrap{display:none}
 .cards{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
 .fineprint{font-size:11px}
 .nav{gap:10px}
}

@media(min-width:371px) and (max-width:790px){
 .pal-card-name{font-size:16px}
 .pal-card-jockey{font-size:12px}
 .pal-card-trainer{font-size:11.5px}
 .pal-card-date{font-size:11.5px}
 .pal-card-actions .replay-link{padding:5px 6px;font-size:10.5px}
 .pal-card-actions .replay-link svg{width:18px;height:17px}
}
@media(max-width:370px){
 .pal-card{grid-template-columns:59px minmax(0,1fr) 70px;column-gap:6px;row-gap:3px;padding:9px 8px}
 .pal-card-date{font-size:10px}
 .pal-card-silk{padding-top:7px}
 .pal-card-silk .robe{height:49px;width:40px}
 .pal-card-name{font-size:15px}
 .pal-card-jockey{font-size:11px}
 .pal-card-trainer{font-size:10.5px}
 .pal-card-actions{gap:3px;margin-top:-23px}
 .pal-card-disc{font-size:10px;padding:3px 2px}
 .pal-card-disc .disc-img{width:17px;height:17px}
 .pal-card-actions .replay-link{padding:4px 5px;font-size:10px}
 .pal-card-actions .replay-link svg{width:17px;height:16px}
 .top{padding:15px 12px}
 .caption-line .legend{gap:3px}
 .caption-line .legend .tag{gap:2px;padding:6px 2px}
 .caption-line .legend .tag .disc-img{width:18px;height:18px;flex-basis:18px}
 .caption-line .legend .tag .disc-text{font-size:10px}
}
.placing-stats{margin-top:12px;font-size:13px;font-weight:700;color:#565656}.placing{display:inline-block;background:#fff0df;color:#a34c0e;border-radius:6px;padding:3px 6px;font-size:12px;white-space:nowrap}.medal{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;box-sizing:border-box;font:800 12px/1 Arial,sans-serif;letter-spacing:-.3px;color:#5c3b0a;background:linear-gradient(145deg,#fff1b7 0%,#e8b844 40%,#bd8322 76%,#f6d779 100%);border:1px solid #b88a31;box-shadow:inset 0 1px 1px #fff9,inset 0 -1px 1px #71430055,0 1px 2px #0002;vertical-align:middle;flex-shrink:0}.medal-2{color:#3f4852;background:linear-gradient(145deg,#fff 0%,#d8dfe5 40%,#9ba5ae 76%,#e8edf1 100%);border-color:#a2abb4}.medal-3{color:#61391f;background:linear-gradient(145deg,#f7d5b4 0%,#c98a5d 40%,#95552f 76%,#e8af83 100%);border-color:#a66c46}.medal-group{display:inline-flex;gap:3px;align-items:center}.rank-cell .medal{width:27px;height:27px;font-size:13px}.pal-card-medal .medal{width:26px;height:26px;font-size:13px}.medal-header{width:clamp(32px,5vw,46px);height:clamp(32px,5vw,46px);font-size:clamp(16px,2.5vw,22px);border-width:2px}@media(max-width:440px){.medal-header{width:32px;height:32px;font-size:16px}}
/* Podium à trois véritables marches : toute la marche est un filtre, sans onglets doublons. */
.top{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:0 4px;background:transparent;border:0;border-radius:0;box-shadow:none}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:7px;min-width:0;width:100%;height:160px}
.podium-step{display:flex;flex-direction:column;justify-content:end;align-items:stretch;gap:0;align-self:end;min-width:0;padding:0;border:0;background:none;font:inherit;cursor:pointer;text-align:center;color:#282321;outline-offset:3px;transition:transform .16s ease,filter .16s ease}
.podium-step:hover{transform:translateY(-2px);filter:brightness(1.03)}
.podium-step:focus-visible,.podium-total:focus-visible{outline:3px solid #f47721;outline-offset:3px}
.podium-step .podium-medal{align-self:center;width:30px;height:30px;font-size:16px;border-width:2px;margin-bottom:-4px;position:relative;z-index:2;box-shadow:0 2px 4px #0003,inset 0 1px 1px #fff9}
.podium-plinth{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;width:100%;border-radius:7px 7px 3px 3px;box-shadow:inset 0 2px 0 #fff9,inset 0 -5px 0 #0000000b,0 3px 6px #26150718;position:relative}
.podium-plinth::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:7px 7px 0 0;background:#ffffff80;border-bottom:1px solid #00000012;pointer-events:none}
.podium-silver .podium-plinth{height:76px;background:linear-gradient(140deg,#f7f9fa,#d3d9df 62%,#bbc4cb);border:1px solid #b2bdc8}
.podium-gold .podium-plinth{height:104px;background:linear-gradient(145deg,#ffe6a2,#f2c867 55%,#dba340);border:1px solid #d4a444}
.podium-bronze .podium-plinth{height:61px;background:linear-gradient(140deg,#f5d2b6,#d89a72 65%,#b97a55);border:1px solid #bf8056}
.podium .podium-count,.podium #counter{font-size:clamp(35px,5.6vw,56px);font-weight:900;line-height:1.05;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:#272322}
/* Couronne de laurier SVG, réservée à la marche OR, discrète et non interactive. */
.podium-gold .podium-plinth{isolation:isolate}
.victory-laurel{position:absolute;top:50%;width:clamp(16px,3.1vw,31px);height:77%;color:#9b671c;opacity:.62;pointer-events:none;z-index:0;transform:translateY(-50%)}
.victory-laurel-left{left:3.5%}
.victory-laurel-right{right:3.5%;transform:translateY(-50%) scaleX(-1)}
.podium-gold .podium-count{position:relative;z-index:1;text-shadow:0 1px 0 #ffebb5}
@media(max-width:790px){
 .victory-laurel{width:clamp(15px,4.8vw,21px);height:72%;opacity:.55}
 .victory-laurel-left{left:2%}
 .victory-laurel-right{right:2%}
}
.podium-label{font-size:clamp(10px,1.6vw,13px);font-weight:900;letter-spacing:.08em;line-height:1.1}
.podium-step[aria-pressed="true"] .podium-plinth{outline:3px solid #f47721;outline-offset:1px;box-shadow:inset 0 2px 0 #fff9,0 0 0 5px #f4772122,0 4px 8px #0002}
.podium-step[aria-pressed="true"] .podium-medal{transform:translateY(-2px);box-shadow:0 0 0 3px #fff,0 0 0 5px #f47721,0 2px 4px #0002}
.podium-total{align-self:center;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 12px;border:1px solid transparent;border-radius:999px;background:transparent;color:#5b524b;font:700 12px/1.3 Arial,Helvetica,sans-serif;cursor:pointer;white-space:nowrap}
.podium-total strong{font-size:16px;color:#bd5414;font-variant-numeric:tabular-nums}
.podium-total .podium-total-hint{font-size:15px;color:#a26a46}
.podium-total[aria-pressed="true"]{background:#fff0e0;border-color:#f3d7ba}
.podium-total:hover{border-color:#eab58d;background:#fff3e8}
.controls{margin-top:13px}
@media(max-width:790px){
 .top{padding:0 2px;border-radius:0}
 .podium{height:138px;gap:5px}
 .podium-step .podium-medal{width:27px;height:27px;font-size:14px;margin-bottom:-3px}
 .podium-silver .podium-plinth{height:65px}
 .podium-gold .podium-plinth{height:91px}
 .podium-bronze .podium-plinth{height:53px}
 .podium .podium-count,.podium #counter{font-size:clamp(35px,10.8vw,46px)}
 .podium-label{font-size:10px}
 .podium-total{font-size:11px;padding:3px 9px}
 .podium-total strong{font-size:14px}
 .controls{margin-top:12px}
}
@media(max-width:370px){
 .podium{height:131px;gap:4px}
 .podium-silver .podium-plinth{height:62px}
 .podium-gold .podium-plinth{height:86px}
 .podium-bronze .podium-plinth{height:50px}
 .podium .podium-count,.podium #counter{font-size:clamp(33px,10vw,38px)}
 .podium-label{font-size:10px}
}

/* Fiches : classement en capsule alignée avec Discipline et Vidéo.
   Les médailles du podium principal conservent leur forme ronde. */
.pal-card-actions .pal-card-disc,
.pal-card-actions .pal-card-medal,
.pal-card-actions .replay-link{
 width:100%;
 min-height:30px;
 box-sizing:border-box;
}
/* Le lien Vidéo est enveloppé dans un bloc : celui-ci doit aussi occuper
   toute la largeur de la colonne, autrement la capsule reste plus étroite. */
.pal-card-actions .pal-card-replay{
 display:flex;
 width:100%;
 min-width:0;
 align-items:stretch;
}
.pal-card-actions .pal-card-replay .replay-link{
 display:flex;
 flex:1 1 auto;
 width:100%;
 min-width:0;
}
.pal-card-actions .pal-card-medal{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 height:30px;
 margin:0;
 padding:3px 9px;
 border-radius:999px;
 font:900 14px/1 Arial,Helvetica,sans-serif;
 letter-spacing:0;
 text-align:center;
 box-shadow:inset 0 1px 1px #fff9,0 1px 2px #0002;
}
@media(max-width:790px){
 /* Filtres mobiles : plus compacts, sans modifier les fonctionnalités. */
 .controls{gap:7px;margin-top:11px}
 .controls input,.controls select{min-height:41px;padding:9px 8px}
 .caption-line{margin:10px 1px 9px;gap:7px}
 .caption-line .legend .tag{min-height:39px;padding:5px 3px}
}
</style></head><body>
<main class="palmares">
<header class="top" aria-label="Podium interactif Écurie Initial">
  <div class="podium" role="group" aria-label="Choisir une marche pour afficher les performances correspondantes">
    <button class="podium-step podium-silver" type="button" data-placing="second" aria-pressed="false" aria-label="Filtrer les deuxièmes places">
      <span class="podium-medal medal medal-2" aria-hidden="true">2</span>
      <span class="podium-plinth"><output class="podium-count" id="silverCounter" aria-label="Deuxièmes places" aria-live="polite">0</output></span>
    </button>
    <button class="podium-step podium-gold" type="button" data-placing="win" aria-pressed="false" aria-label="Filtrer les victoires">
      <span class="podium-medal medal medal-1" aria-hidden="true">1</span>
      <span class="podium-plinth"><svg class="victory-laurel victory-laurel-left" viewBox="0 0 36 92" aria-hidden="true" focusable="false"><path d="M30 87C14 74 10 55 15 36C17 24 22 15 28 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M28 79Q12 75 4 63Q19 64 28 79ZM22 69Q7 64 5 50Q20 55 22 69ZM17 57Q3 49 7 37Q20 44 17 57ZM16 44Q6 32 13 22Q23 34 16 44ZM20 31Q15 18 27 8Q28 23 20 31ZM27 75Q36 63 34 52Q23 61 27 75ZM21 62Q36 52 34 40Q23 47 21 62ZM17 49Q32 39 32 27Q21 33 17 49ZM17 36Q30 27 29 16Q21 22 17 36Z" fill="currentColor"/></svg><output class="podium-count" id="counter" aria-label="Victoires" aria-live="polite">172</output><svg class="victory-laurel victory-laurel-right" viewBox="0 0 36 92" aria-hidden="true" focusable="false"><path d="M30 87C14 74 10 55 15 36C17 24 22 15 28 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M28 79Q12 75 4 63Q19 64 28 79ZM22 69Q7 64 5 50Q20 55 22 69ZM17 57Q3 49 7 37Q20 44 17 57ZM16 44Q6 32 13 22Q23 34 16 44ZM20 31Q15 18 27 8Q28 23 20 31ZM27 75Q36 63 34 52Q23 61 27 75ZM21 62Q36 52 34 40Q23 47 21 62ZM17 49Q32 39 32 27Q21 33 17 49ZM17 36Q30 27 29 16Q21 22 17 36Z" fill="currentColor"/></svg></span>
    </button>
    <button class="podium-step podium-bronze" type="button" data-placing="third" aria-pressed="false" aria-label="Filtrer les troisièmes places">
      <span class="podium-medal medal medal-3" aria-hidden="true">3</span>
      <span class="podium-plinth"><output class="podium-count" id="bronzeCounter" aria-label="Troisièmes places" aria-live="polite">0</output></span>
    </button>
  </div>
  <button class="podium-total" type="button" data-placing="all" aria-pressed="true" aria-label="Afficher tous les podiums">
    <span>Tous les podiums</span><strong id="allPodiums" aria-live="polite">172</strong><span class="podium-total-hint" aria-hidden="true">↺</span>
  </button>
</header>
<section aria-label="Filtrer les performances" class="controls">
<label><select id="year" aria-label="Année"><option value="">Année</option></select></label>
<label><select id="horse" aria-label="Filtrer par cheval"><option value="">Cheval</option></select></label>
<label><select id="pilot" aria-label="Filtrer par jockey ou driver"><option value="">Jockey / Driver</option></select></label>
<label class="trainer-filter"><select id="trainer" aria-label="Filtrer par entraîneur"><option value="">Entraîneur</option></select></label>
<label class="hippodrome-filter"><select id="search" aria-label="Filtrer par hippodrome"><option value="">Hippodrome</option></select></label>
<label><select id="order" aria-label="Classement"><option value="desc">Plus récentes d'abord</option><option value="asc">Plus anciennes d'abord</option></select></label>
</section>

function nomProprietaire(s){
 return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
}
function victoireAdmiseAuCompteur(r){
 if(r.compteInitial===false)return false;
 // Les casaques de tiers restent visibles mais ne sont jamais comptabilisées.
 if(["julien","homa"].includes(r.casaque))return false;
 const discipline=["galop","obstacle"].includes(r.discipline)?"galop":["attele","monte","trot"].includes(r.discipline)?"trot":null;
 if(!discipline)return false;
 // Si le propriétaire est identifié, sa valeur fait foi, pas la casaque ni le jockey.
 if(r.proprietaire)return proprietairesAdmis[discipline].has(nomProprietaire(r.proprietaire));
 // Historique : attribution validée via la casaque de chaque victoire.
 // Les succès sous d'autres couleurs (JULIEN, HOMA, etc.) restent exclus.
 if(!archivesInitiales.has(r)&&!podiumsConfirmes.has(r))return false;
 return discipline==="galop"?r.casaque==="galop":["historique","nathalie","blanche"].includes(r.casaque);
}

// L'ancien visuel galop a un fond gris intégré aux pixels de l'image.
// On retire seulement les gris extérieurs, sans redessiner la casaque.
function fondTransparentCasaqueGalop(){
 const img=new Image();
 img.onload=()=>{
  try{
   const canvas=document.createElement("canvas");
   canvas.width=160;canvas.height=190;
   const ctx=canvas.getContext("2d",{willReadFrequently:true});
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
   const d=pixels.data,w=canvas.width,h=canvas.height;
   const seen=new Uint8Array(w*h),queue=new Int32Array(w*h);
   let head=0,tail=0;
   function visit(i){
    if(seen[i])return;
    seen[i]=1;
    const p=i*4,r=d[p],g=d[p+1],b=d[p+2];
    const light=(r+g+b)/3;
    // Le fond gris est neutre et relié aux bords de l'image.
    if(d[p+3]>0 && light>105 && light<246 && Math.max(r,g,b)-Math.min(r,g,b)<25){
     d[p+3]=0;
     queue[tail++]=i;
    }
   }
   for(let x=0;x<w;x++){visit(x);visit((h-1)*w+x)}
   for(let y=0;y<h;y++){visit(y*w);visit(y*w+w-1)}
   while(head<tail){
    const i=queue[head++],x=i%w,y=(i/w)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
     if(!dx&&!dy)continue;
     const nx=x+dx,ny=y+dy;
     if(nx>=0&&nx<w&&ny>=0&&ny<h)visit(ny*w+nx);
    }
   }
   // Préserve le fichier original s'il est déjà sur fond transparent.
   if(tail<w*h*0.08)return;
   ctx.putImageData(pixels,0,0);
   silkFiles.galop=canvas.toDataURL("image/png");
   render();
  }catch(e){/* Conserve l'image d'origine en cas d'échec. */}
 };
 img.src=silkFiles.galop;
}

// Liens de course et de replay référencés : la présence d'une fiche Equidia ne garantit pas la lecture d'une vidéo.
// Navigation publique du palmarès uniquement vers LeTROT et Equidia.
function replayUrl(value){
 try{
  const url=new URL(String(value||""));
  if(url.protocol!=="https:")return "";
  const host=url.hostname.replace(/^www\./,"").toLowerCase();
  const letrot=host==="letrot.com"&&(
    /^\/courses\/\d{4}-\d{2}-\d{2}\/\d+\/\d+\/?$/.test(url.pathname)||
    /^\/fr\/courses\/replay-courses\/\d{4}-\d{2}-\d{2}\/\d+\/\d+\/?$/.test(url.pathname)
  );
  const equidia=host==="equidia.fr"&&
    /^\/courses\/\d{4}-\d{2}-\d{2}\/R\d+\/C\d+\/?$/i.test(url.pathname);
  return letrot||equidia?url.href:"";
 }catch{return ""}
}
function resultatUrl(value){return replayUrl(value)}
function replayPreference(value,record,discipline){
 const url=replayUrl(value);
 if(!url)return null;
 const host=new URL(url).hostname.replace(/^www\./,"").toLowerCase();
 // Les plateformes peuvent numéroter différemment une même réunion
 // (ex. Lisieux le 01/11/2026). Contrôler la date exacte du lien plutôt
 // que comparer arbitrairement les numéros R d'Equidia et d'autres sites.
 if(record&&record.date){
  const inUrl=new URL(url).pathname.match(/\/(\d{4}-\d{2}-\d{2})\//);
  if(!inUrl||inUrl[1]!==record.date)return null;
 }
 if(discipline==="galop"||discipline==="obstacle"){
  if(host!=="equidia.fr")return null;
  return {url,score:140,isVideo:true};
 }
 if(host==="letrot.com")return {url,score:url.includes("/fr/courses/replay-courses/")?180:140,isVideo:true};
 if(host==="equidia.fr")return {url,score:110,isVideo:true};
 return null;
}

async function loadReplays(){
 try{
  // Réutiliser les liens déjà présents sur les fiches chevaux, y compris
  // lorsqu'ils ne sont pas encore copiés dans replays.json.
  // Chaque source est indépendante : l'une peut fonctionner même si l'autre échoue.
  const [archive,fiche]=await Promise.allSettled([
    fetch("./replays.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Replays indisponibles");return r.json()}),
    fetch("../chevaux/data/editorial.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Fiches indisponibles");return r.json()})
  ]);
  const archiveLinks=archive.status==="fulfilled"&&Array.isArray(archive.value.replays)?archive.value.replays:[];
  const performances=fiche.status==="fulfilled"?fiche.value.performances||{}:{};
  const ficheLinks=[];
  for(const [slug,list] of Object.entries(performances)){
    if(!Array.isArray(list))continue;
    for(const course of list){
      if(!course||!course.date||!course.hippodrome||(!course.video_url&&!course.course_url&&!course.source_url))continue;
      ficheLinks.push({date:course.date,cheval:slug.replace(/-/g," "),hippodrome:course.hippodrome,url:course.video_url||"",course_url:course.course_url||"",source_url:course.source_url||""});
    }
  }
  const candidates=[...archiveLinks,...ficheLinks];
  const normalizeReplayKey=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const byHorseAndDate=new Map();
  for(const r of results){
    const key=r.date+"|"+normalizeReplayKey(r.cheval);
    if(!byHorseAndDate.has(key))byHorseAndDate.set(key,[]);
    byHorseAndDate.get(key).push(r);
  }
  for(const video of candidates){
    if(!video||!video.date||!video.cheval||!video.hippodrome)continue;
    const matching=byHorseAndDate.get(video.date+"|"+normalizeReplayKey(video.cheval))||[];
    const exact=matching.filter(r=>normalizeReplayKey(r.hippodrome)===normalizeReplayKey(video.hippodrome));
    const row=exact.length===1?exact[0]:(matching.length===1?matching[0]:null);
    if(!row)continue;
    // Liens officiels uniquement, correspondant au cheval et à la date.
    const options=[
      video.lien_letrot_precedent,video.lien_replay_original,
      video.lien_equidia_precedent,video.lien_fiche_course_precedent,
      video.url,video.course_url,video.video_url,video.source_url
    ].map(value=>replayPreference(value,video,row.discipline)).filter(Boolean)
     .sort((a,b)=>b.score-a.score);
    const courseUrl=[video.course_url,video.source_url]
      .map(resultatUrl).find(Boolean);
    if(courseUrl&&!resultatUrl(row.source))row.source=courseUrl;
    if(!options.length)continue;
    const best=options[0];
    if(best.score>(row.videoPriority||0)){
      row.video=best.url;
      row.videoSource=best.isVideo?"video":"course";
      row.videoPriority=best.score;
    }
  }
  render();
 }catch(err){/* Les résultats déjà disponibles restent visibles. */}
}

 $("counter").textContent=new Intl.NumberFormat("fr-FR").format(total);

}

async function loadNewVictories(){
 // Une ligne du fichier = un nouveau succès approuvé après la date de référence.
 try{
  const response=await fetch("./victoires-a-ajouter.json",{cache:"no-store"});
  if(!response.ok)throw Error("Fichier de victoires non disponible");
  const json=await response.json();
  const raw=Array.isArray(json.victoires)?json.victoires:[];
  const add=raw.filter(v=>v && /^\d{4}-\d{2}-\d{2}$/.test(v.date||"") && typeof v.cheval==="string" && v.cheval.trim() && typeof v.hippodrome==="string" && v.hippodrome.trim()).map(v=>({
   date:v.date,cheval:v.cheval.trim(),hippodrome:v.hippodrome.trim(),
   discipline:["attele","monte","galop","obstacle","trot"].includes(v.discipline)?v.discipline:"trot",
   jockey:typeof v.jockey==="string"?v.jockey.trim():"",
   entraineur:typeof v.entraineur==="string"?v.entraineur.trim():"",
   casaque:Object.hasOwn(silkFiles,v.casaque)?v.casaque:"blanche",
   proprietaire:typeof v.proprietaire==="string"?v.proprietaire.trim():"",
   compteInitial:v.compteInitial!==false
  }));
  const keys=new Set(results.map(v=>[v.date,v.cheval,v.hippodrome].join("|").toUpperCase()));
  const unique=add.filter(v=>{const key=[v.date,v.cheval,v.hippodrome].join("|").toUpperCase();if(keys.has(key))return false;keys.add(key);return true});
  results.push(...unique);updateCounter();refreshYears();refreshNameFilters();render();
 }catch(err){updateCounter()}
}
