<path d="M70 36l2 4 4 .6-3 3 .8 4-3.8-1.9-3.8 1.9 .8-4-3-3 4-.6Z"/>
<path d="M75 51l2 4 4 .6-3 3 .8 4-3.8-1.9-3.8 1.9 .8-4-3-3 4-.6Z"/>
</g>
