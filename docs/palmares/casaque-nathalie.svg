<path d="M30 25L18 29Q10 31 7 44L3 62Q8 69 21 68L26 58L25 85L59 85L58 58L63 68Q76 69 81 62L77 44Q74 31 66 29L54 25" fill="none" stroke="#222" stroke-width="1.8"/>
