<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Effectif Trot — Écurie Initial</title><style>:root{--orange:#f47721;--dark:#171717}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#222;font:15px Arial,Helvetica,sans-serif}.scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:max-content;min-width:100%;table-layout:auto;border-collapse:collapse;background:#fff}thead{background:var(--dark);color:#fff}th,td{padding:10px 12px;border-bottom:1px solid #ececec;text-align:left;vertical-align:middle}th{font-weight:700;font-size:14px}tbody tr:nth-child(even){background:#fff7f0}tbody tr:hover{background:#ffecdc}td:first-child{font-weight:700;min-width:0;white-space:nowrap}td:nth-child(2){width:80px;white-space:nowrap}td:nth-child(3){width:135px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}th:nth-child(3){text-align:right}td:nth-child(4){min-width:155px}.rest{display:block;color:#aa5519;font-size:12px;font-weight:600;margin-top:3px}@media(max-width:600px){th,td{padding:8px 9px}}</style></head><body><main class="scroll"><table><thead><tr><th>Cheval</th><th>Record</th><th>Gains</th><th>Entraîneur</th></tr></thead><tbody id="rows"></tbody></table></main><script>

omme/Bruno-MARIE/YmFabAUFYA/entraineur","casaque":"blanche"},{"name":"MYRTILLE MARBOULA","id":"myrtille-marboula","trainer":"Bruno MARIE","horseLink":"https://www.letrot.com/stats/chevaux/myrtille-marboula/ZmBbYgAAAwQV/courses","trainerLink":"https://www.letrot.com/stats/homme/Bruno-MARIE/YmFabAUFYA/entraineur","casaque":"orange"},{"name":"NEBRASKA FLEURY","id":"nebraska-fleury","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/NEBRASKA-FLEURY/ZmF8ZQUGBwQB/courses","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"NELSON STAR","id":"nelson-star","trainer":"Michel HANQUIER","horseLink":null,"trainerLink":"https://www.letrot.com/stats/homme/Michel-HANQUIER/YGZ3ZgEFfw/entraineur","casaque":"blanche"},{"name":"NOSTALGIE DAIRPET","id":"nostalgie-dairpet","trainer":"Laurent BARASSIN","horseLink":null,"trainerLink":null,"casaque":"blanche"},{"name":"ODACIEUSE FLEURY","id":"odacieuse-fleury","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/ODACIEUSE-FLEURY/ZmZbYgsEBAYG/courses","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"OLANO DE LA VALLÉE","id":"olano-de-la-vallee","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/OLANO-DE-LA-VALLEE/ZmZbbAIBAwcG/courses","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"PALAZZO GRASSI","id":"palazzo-grassi","trainer":"Laurent BARASSIN","horseLink":null,"trainerLink":null,"casaque":"blanche"},{"name":"PHACÉLIE BILOU","id":"phacelie-bilou","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/phacelie-bilou/Zmd8ZAYABQMV/elevage","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"POPSTAR D'ERI","id":"popstar-d-eri","trainer":"Vincent HÉBERT","horseLink":"https://www.l const tbody=document.getElementById('rows');
const el=(tag,txt)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x;};
function display(records){tbody.replaceChildren();for(const h of horses){const source=records?.[h.id]||{};const tr=el('tr');tr.append(el('td',h.name));tr.append(el('td',source.record??'—'));tr.append(el('td',Number.isFinite(source.gains)?new Intl.NumberFormat('fr-FR').format(source.gains)+' €':'—'));tr.append(el('td',h.trainer||'—'));tbody.append(tr);}}
fetch('data/effectif-trot.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(v=>display(v.horses)).catch(()=>display(null));
</script></body></html>
