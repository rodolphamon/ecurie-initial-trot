<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Effectif Trot — Écurie Initial</title><style>
:root{--orange:#f47721;--dark:#171717}
*{box-sizing:border-box}
html,body{margin:0;padding:0;color:#26221f;font:15px Arial,Helvetica,sans-serif;background:transparent}
.page{max-width:1100px;margin:18px auto;padding:0 12px 24px}
.panel{background:rgba(255,255,255,.9);border:1px solid #eadfd6;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:22px 22px 16px}
.panel h1{font-size:clamp(26px,3.4vw,36px);margin:0;font-weight:800;letter-spacing:-.5px}
.underline{width:150px;background:var(--orange);height:4px;border-radius:4px;margin:12px 0}
.lead{margin:0;color:#665f59;font-size:14px;line-height:1.5}
.tools{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.switch{display:inline-flex;padding:11px 15px;background:var(--orange);color:#161616!important;border-radius:9px;text-decoration:none;font-size:13px;font-weight:700}
.count{display:inline-flex;border:1px solid #eadfd6;background:#faf6f2;padding:9px 12px;border-radius:9px;font-size:13px;color:#504a44}
.scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 14px 18px}
.table-frame{border:1px solid #ede4dc;border-radius:12px;overflow:hidden;min-width:860px}
table{width:100%;border-collapse:collapse;background:#fff;table-layout:auto}
thead{background:var(--dark);color:#fff}
th,td{padding:11px 7px;border-bottom:1px solid #ede7e0;text-align:left;vertical-align:middle;white-space:nowrap;font-size:clamp(11px,1.35vw,13px)}
th{font-size:13px;font-weight:700;border-bottom:3px solid var(--orange)}
tbody tr:nth-child(even){background:#fdf8f3}
tbody tr:hover{background:#fff0e3}
td:first-child{font-weight:750;min-width:168px}
td:nth-child(2){white-space:nowrap}
td:nth-child(3){white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
th:nth-child(3){text-align:right}
td:nth-child(4),td:nth-child(5){min-width:130px}
td:nth-child(6){min-width:145px}
.rest{display:inline-block;vertical-align:middle;margin-left:7px;white-space:nowrap;color:#a64d08;background:#fff0e4;border:1px solid #ffd6b6;border-radius:30px;padding:3px 8px;font-size:11px;font-weight:700}
a.ei-horse-link{color:#171717;font-weight:800;text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:4px}
a.ei-horse-link:hover{color:#bf570e}
.note{color:#79716b;font-size:12px;padding:0 22px 18px}
@media(max-width:650px){.page{padding:0 5px;margin:8px auto}.panel-head{padding:16px 14px}.scroll{padding:0 8px 12px}th,td{padding:10px 7px;font-size:12px}.note{padding:0 14px 14px}}
</style></head><body><main class="page"><section class="panel"><header class="panel-head"><div><h1>EFFECTIF TROT</h1><div class="underline"></div><p class="lead">Nos trotteurs, leurs records, leurs gains et leurs entraîneurs.</p></div><div class="tools"><span class="count" id="horseCount">Effectif en cours de chargement</span><a class="switch" href="https://www.ecurie-initial.com/galopeurs/" target="_top" rel="noopener">Voir l’effectif Galop</a></div></header><div class="scroll"><div class="table-frame"><table><thead><tr><th>Cheval</th><th>Record</th><th>Gains</th><th>Père</th><th>Mère</th><th>Entraîneur</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="note">Cliquez sur le nom d’un cheval pour consulter sa fiche.</div></section></main><script>
const horses=[{"name":"INDICE DELADOU","id":"indice-deladou","trainer":"Charley HESLOUIN","horseLink":"https://www.letrot.com/stats/chevaux/INDICE-DELADOU/ZWpbZwsDBgMV/courses","trainerLink":"https://www.letrot.com/stats/homme/Charley-HESLOUIN/ZWV6ZgsCYg/entraineur","casaque":"blanche"},{"name":"ISOLÉE DU BOUILLON","id":"isolee-du-bouillon","trainer":"Bruno MARIE","horseLink":"https://www.letrot.com/stats/chevaux/ISOLEE-DU-BOUILLON/ZWpbZQQJAgMG/courses","trainerLink":"https://www.letrot.com/stats/homme/Bruno-MARIE/YmFabAUFYA/entraineur","casaque":"blanche"},{"name":"LORD ON WAY","id":"lord-on-way","trainer":"Bruno MARIE","horseLink":"https://www.letrot.com/stats/chevaux/LORD-ON-WAY/ZmN8ZgYHAQUa/courses","trainerLink":"https://www.letrot.com/stats/homme/Bruno-MARIE/YmFabAUFYA/entraineur","casaque":"blanche"},{"name":"LUCKY DES GAUDINES","id":"lucky-des-gaudines","trainer":"Mathieu DAOUGABEL","horseLink":"https://www.letrot.com/stats/chevaux/LUCKY-DES-GAUDINES/ZmN8ZwMFAwoF/courses","trainerLink":"https://www.letrot.com/stats/homme/Mathieu-DAOUGABEL/bGt2bQMHdg/entraineur","casaque":"orange"},{"name":"MANDRAGORA FLEURY","id":"mandragora-fleury","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/MANDRAGORA-FLEURY/ZmBbYgoHBgQf/courses","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"MEMPHIS BELLE","id":"memphis-belle","trainer":"Laurent BARASSIN","horseLink":"https://www.letrot.com/stats/chevaux/memphis-belle/ZmB9ZwMIAQYY/courses","trainerLink":null,"casaque":"blanche"},{"name":"MONA LISA STARDUST","id":"mona-lisa-stardust","trainer":"Michel HANQUIER","horseLink":null,"trainerLink":"https://www.letrot.com/stats/homme/Michel-HANQUIER/YGZ3ZgEFfw/entraineur","casaque":"orange"},{"name":"MOONDANCE OKINA","id":"moondance-okina","trainer":"Bruno MARIE","horseLink":"https://www.letrot.com/stats/chevaux/MOONDANCE-OKINA/ZmBbbAMIAQUc/courses","trainerLink":"https://www.letrot.com/stats/homme/Bruno-MARIE/YmFabAUFYA/entraineur","casaque":"blanche"},{"name":"MYRTILLE MARBOULA","id":"myrtille-marboula","trainer":"Bruno MARIE","horseLink":"https://www.letrot.com/stats/chevaux/myrtille-marboula/ZmBbYgAAAwQV/courses","trainerLink":"https://www.letrot.com/stats/homme/Bruno-MARIE/YmFabAUFYA/entraineur","casaque":"orange"},{"name":"NEBRASKA FLEURY","id":"nebraska-fleury","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/NEBRASKA-FLEURY/ZmF8ZQUGBwQB/courses","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"NELSON STAR","id":"nelson-star","trainer":"Michel HANQUIER","horseLink":null,"trainerLink":"https://www.letrot.com/stats/homme/Michel-HANQUIER/YGZ3ZgEFfw/entraineur","casaque":"blanche"},{"name":"NOSTALGIE DAIRPET","id":"nostalgie-dairpet","trainer":"Laurent BARASSIN","horseLink":null,"trainerLink":null,"casaque":"blanche"},{"name":"ODACIEUSE FLEURY","id":"odacieuse-fleury","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/ODACIEUSE-FLEURY/ZmZbYgsEBAYG/courses","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"OLANO DE LA VALLÉE","id":"olano-de-la-vallee","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/OLANO-DE-LA-VALLEE/ZmZbbAIBAwcG/courses","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"PALAZZO GRASSI","id":"palazzo-grassi","trainer":"Laurent BARASSIN","horseLink":null,"trainerLink":null,"casaque":"blanche"},{"name":"PHACÉLIE BILOU","id":"phacelie-bilou","trainer":"A. RIPOLL RIGO","horseLink":"https://www.letrot.com/stats/chevaux/phacelie-bilou/Zmd8ZAYABQMV/elevage","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"POPSTAR D'ERI","id":"popstar-d-eri","trainer":"Vincent HÉBERT","horseLink":"https://www.letrot.com/stats/chevaux/popstar-d%27eri/Zmd8ZQECBwYG/elevage","trainerLink":"https://www.letrot.com/stats/homme/Vincent-HEBERT/Z2t2ZAYDdQ/entraineur","casaque":"blanche"},{"name":"PRINCE GIO","id":"prince-gio","trainer":"Laurent BARASSIN","horseLink":null,"trainerLink":null,"casaque":"blanche"}];
const tbody=document.getElementById('rows');
const el=(tag,txt)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x;};
function display(records,profiles){tbody.replaceChildren();document.getElementById('horseCount').textContent=horses.length+' chevaux à l’effectif';for(const h of horses){const source=records?.[h.id]||{};const tr=el('tr');const cell=el('td');const link=el('a',h.name);link.href=h.newHorse?'chevaux/fiche/?cheval='+encodeURIComponent(h.id):'chevaux/'+encodeURIComponent(h.id)+'/';link.className='ei-horse-link';link.target='_blank';link.rel='noopener';cell.append(link);if(h.rest){const badge=el('span','Au repos');badge.className='rest';cell.append(badge)}tr.append(cell);tr.append(el('td',source.record??'—'));tr.append(el('td',Number.isFinite(source.gains)?new Intl.NumberFormat('fr-FR').format(source.gains)+' €':'—'));const origin=h.origines||profiles?.[h.id]?.origines||{};tr.append(el('td',origin.pere||'—'));tr.append(el('td',origin.mere||'—'));tr.append(el('td',h.trainer||'—'));tbody.append(tr);}}
Promise.all([
  fetch('data/effectif-trot.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}),
  fetch('chevaux/data/chevaux.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
]).then(async ([v,p])=>{
 try{
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const db=createClient('https://yeecwaaizmvrhwobukfa.supabase.co','sb_publishable_xUy2EJA3u3cKWl8BB4GNPQ_qhV9Pes3');
  const [gainResult,recordResult,effectifResult,statusResult]=await Promise.all([
    db.from('ei_contributions_gains').select('cheval_slug,gains'),
    db.from('ei_contributions_records').select('cheval_slug,chrono'),
    db.from('ei_effectif_gestion').select('cheval_slug,nom,discipline,casaque,entraineur,nouveau,actif,pere,mere'),
    db.from('ei_statuts_chevaux').select('cheval_slug,au_repos')
  ]);
  if(gainResult.error||recordResult.error||effectifResult.error||statusResult.error)throw Error('Contributions indisponibles');
  const updated=new Map(horses.map(h=>[h.id,h]));
  for(const row of effectifResult.data||[]){
    if(row.discipline!=='Trot')continue;
    if(!row.actif){updated.delete(row.cheval_slug);continue}
    const previous=updated.get(row.cheval_slug)||{};
    updated.set(row.cheval_slug,{...previous,id:row.cheval_slug,name:row.nom,trainer:row.entraineur,casaque:row.casaque,newHorse:row.nouveau,origines:{...(p.horses||[]).find(h=>h.id===row.cheval_slug)?.origines,...(row.pere?{pere:row.pere}:{}),...(row.mere?{mere:row.mere}:{})}});
  }
  horses.splice(0,horses.length,...[...updated.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr')));
  for(const row of statusResult.data||[]){const h=updated.get(row.cheval_slug);if(h)h.rest=row.au_repos===true;}
  for(const row of gainResult.data||[])if(v.horses?.[row.cheval_slug]&&Number.isSafeInteger(Number(row.gains)))
    v.horses[row.cheval_slug].gains=Number(row.gains);
  for(const row of recordResult.data||[])if(v.horses?.[row.cheval_slug]&&/^\d{1,2}'[0-5]\d"\d$/.test(row.chrono||''))
    v.horses[row.cheval_slug].record=row.chrono;
 }catch(error){console.warn('Gains en direct indisponibles, montants de référence conservés',error)}
 display(v.horses,Object.fromEntries((p.horses||[]).map(h=>[h.id,h])));
})
.catch(()=>display(null,null));
</script>
<script>
(function(){
 const notify=()=>{
  if(window.parent===window)return;
  const page=document.querySelector('.page')||document.body;
  const height=Math.ceil(page.getBoundingClientRect().bottom+18);
  if(!Number.isFinite(height)||height<150)return;
  window.parent.postMessage({type:'ei-effectif-resize',discipline:'trot',height},'https://www.ecurie-initial.com');
 };
 window.addEventListener('load',notify);
 if('ResizeObserver' in window)new ResizeObserver(notify).observe(document.querySelector('.page')||document.body);
 window.addEventListener('resize',notify);
 requestAnimationFrame(notify);
})();
</script></body></html>
