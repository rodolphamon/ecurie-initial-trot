# Invitations et gestion des participations : JWT du compte admin obligatoire.
# Ne pas désactiver cette vérification au déploiement.
[functions.gerer-associes]
verify_jwt = true

# Écurie Initial — vérification des appels réalisée par le code de chaque fonction.
# notifications : contrôle du jeton de l'appareil + Supabase Auth facultative.
# push-dispatch : contrôle obligatoire du secret PUSH_JOB_SECRET.
[functions.notifications]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

# Fonctions sauvegardées depuis le service Supabase en production (20/11/2026).
# smart-service : requiert un JWT vérifié par la plateforme.
[functions.smart-service]
verify_jwt = true

# team-contact : authentification et contrôles métier gérés dans le code.
[functions.team-contact]
verify_jwt = false

# push-receipt : accusés de réception des notifications ; contrôle côté code.
[functions.push-receipt]
verify_jwt = false

# Lecture des seuls résultats publics déjà officialisés ; aucune donnée de compte.
[functions.public-race-results]
verify_jwt = false
